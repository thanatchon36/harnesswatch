# Rater 1 scoring decisions for E1 (RQ2 control matrix).
# Read by experiments/e1_matrix.py. One entry per harness x dimension (D01-D15).
#   s: score 0-3, or null for N/A (then r must start with "N/A").
#   r: short rationale applying matrix/rubric.yaml literally to the facts.
#   f: cited facts. An int i is fact i of the same dimension in matrix/evidence/<harness>.json;
#      "Dxx.i" cites fact i of another dimension of the same file. Omitted -> all eligible facts.
# Rules applied: unverified facts ignored; third-party-report facts only lower a score; verified-by-test
# facts of tier-C or docs-only harnesses are cited as from-official-docs (source/API reads, ASSUMPTIONS A09).
rater: rater1
date: '2026-10-15'
scores:
  claude-code:
    D01: {s: 1, f: [0, 1, 2, 3], r: "Built-in starting mode on 2.1.300 is the classifier-based auto mode (interactive >=2.1.283; -p without feature flags >=2.1.285), which runs shell and edits without asking the user, so the score-1 clause 'default mode runs shell or writes without asking' applies and the score-2 clause 'default mode asks before shell commands' is not met. A classifier decision is not a user prompt. Score-3 controls otherwise exist (deny in every mode, bypass/auto not settable from project files, managed disableBypassPermissionsMode/disableAutoMode); with Manual as default this would be 3. See e1_notes.md."}
    D02: {s: 1, f: [0, 1], r: "Seatbelt/bubblewrap sandbox exists but sandbox.enabled=false by default and falls open unless failIfUnavailable=true."}
    D03: {s: 1, f: [0, 1, 2], r: "Proxy-enforced allowedDomains (default empty, managed lock) applies only inside the opt-in sandbox; WebFetch has a vendor hostname blocklist, not a restriction to approved hosts, and under the default auto mode fetch is not documented to ask."}
    D04: {s: 2, f: [0, 1, 3, 2], r: "Interactive trust dialog gates settings hooks, MCP approvals and project settings; -p/SDK is documented to skip it (allowed at 2). Not 3: headless needs no flag and env/hooks/.mcp.json are used in untrusted -p runs. Patched pre-trust bypasses CVE-2025-59536 and CVE-2026-21852 noted."}
    D05: {s: 1, f: [0, 1, 2], r: "Per-server approval for .mcp.json and managed allow/deny lists exist, but per-tool MCP permissions and definition-change detection are not documented in the evidence, and -p connects project servers without asking."}
    D06: {s: 1, f: [0, 1, 2], r: "Managed marketplace allowlist (strictKnownMarketplaces) and SHA pinning exist, but no vetting, scanning or signing is documented (score-2 clause unmet). Patched SHA-pin bypass CVE-2026-86063 noted."}
    D07: {s: 2, f: [0, 1, 5, 3], r: "Keychain on macOS, 0600 file on Linux (verified locally); 30-day transcript retention documented; redaction only for uploaded transcripts. Not 3: local transcripts plaintext, env scrub off by default, no default secret-file read deny."}
    D08: {s: 1, f: [0, 1, 2, 3], r: "-p defaults are permissive: folder treated as trusted, repo hooks/env and .mcp.json servers used, and auto mode is the starting mode when flags are not fetched. Action checks actor write access, but minimal-token permissions are not documented in the evidence."}
    D09: {s: 2, f: [0, 1], r: "Auto memory is per-project plain files under ~/.claude/projects, visible and editable, with autoMemoryEnabled=false off switch. Not 3: on by default, writes not confirmed, no scanning documented."}
    D10: {s: 1, f: [0], r: "Subagents inherit parent permission rules; per-agent tools and worktree isolation exist, but whether a parent bypass mode propagates is not documented (only agent-declared bypass is ignored under managed disable), so the score-2 clause is not met."}
    D11: {s: 2, f: [0, 1], r: "Structured JSONL transcripts with tool calls plus opt-in OpenTelemetry export. Not 3: policy enforcement of export and an admin-change audit log are not documented."}
    D12: {s: 2, f: [0, 1, 3, 4], r: "Opt-out of telemetry/error reporting documented; retention documented by plan; commercial data not trained on by default; ZDR available. Not 3: usage metrics on by default for the Claude API, admin enforcement not documented."}
    D13: {s: 2, f: [0, 1, 2, 3], r: "GPG-signed release manifest, signed package repos, macOS/Windows code signing; update channel pinnable/disableable. Not 3: no npm provenance attestation, no SBOM, Linux binaries unsigned."}
    D14: {s: 2, f: [0, 1, 2, 3, "D03.0", "D06.0"], r: "Managed settings at top precedence cover permissions, hooks, MCP, sandbox domains and marketplaces. Not 3: managed control of telemetry not documented in the evidence and the precedence is not verified by test."}
    D15: {s: 3, f: [0, 1], r: "SECURITY.md, HackerOne bounty, 35 GitHub security advisories mostly with CVE IDs (GitHub advisory feed)."}
  aider:
    D01: {s: 1, f: [0, 1, 2, "D04.0"], r: "Shell suggestions need explicit yes, but there are no allow/deny rules, edits and auto-commits happen without asking, and repo-controlled .aider.conf.yml can set test/lint commands that run without prompt."}
    D02: {s: 0, f: [0], r: "No sandbox."}
    D03: {s: 1, f: [0], r: "Adding a URL to chat asks for confirmation (auto-yes under --yes-always); no control for shell traffic."}
    D04: {s: 0, f: [0], r: "Repo .aider.conf.yml and .env (override=True) load silently from git root/cwd; no trust concept."}
    D05: {s: null, r: "N/A (feature absent: no MCP client in aider source)."}
    D06: {s: null, r: "N/A (feature absent: no plugin/extension mechanism)."}
    D07: {s: 1, f: [0, 1], r: "Keys in env/.env/plaintext config, history files in repo root; no redaction or read protection documented."}
    D08: {s: 1, f: [0, "D01.0"], r: "Scripted mode (--message/--yes-always) keeps the explicit-yes gate for shell, but there is no official CI integration with documented minimal permissions or actor checks."}
    D09: {s: null, r: "N/A (feature absent: no persistent agent memory; chat-history restore is opt-in)."}
    D10: {s: null, r: "N/A (feature absent: no sub-agents)."}
    D11: {s: 1, f: [0], r: "Local markdown chat history and optional LLM/analytics logs; no structured tool-call log or export."}
    D12: {s: 1, f: [0], r: "Analytics are opt-in (sampled prompt), but no retention period is documented, which is the score-1 clause."}
    D13: {s: 1, f: [0, 1], r: "PyPI and curl|sh installer without documented checksum, signature or provenance."}
    D14: {s: null, r: "N/A (not documented: no managed-policy facts collected; the rubric's 0-for-no-enterprise-offering clause needs a documented absence)."}
    D15: {s: 0, f: [0], r: "No SECURITY.md and no published advisories found."}
  amp:
    D01: {s: 1, f: [0, 1], r: "No approval prompts by default; per-call approval only via a user/admin policy plugin."}
    D02: {s: 1, f: [0, 1], r: "Isolation only via opt-in remote orbs (--executor orb); no local sandbox."}
    D03: {s: 0, f: [0], r: "No agent egress allowlist documented; only the client's own required domains are listed."}
    D04: {s: 1, f: [0, 1, 2], r: "Workspace MCP servers need approval, but project plugins and AGENTS.md load without a trust prompt."}
    D05: {s: 1, f: [0, 1, 2], r: "Workspace servers need approval and an enterprise registry allowlist exists, but amp.mcpPermissions defaults to allow and is per server, not per tool; no change detection."}
    D06: {s: 1, f: [0, 1], r: "Plugins are arbitrary JS/TS run in the user's environment, project plugins load without prompt; no vetting or signing."}
    D07: {s: 1, f: [0, 1, 2], r: "Plaintext ~/.local/share/amp/secrets.json, mode not documented; best-effort redaction. Score 2 needs keychain or verified 0600."}
    D08: {s: 1, f: [0, 1, "D01.0"], r: "Execute mode inherits the no-approval default; docs recommend a policy plugin or isolated environment for untrusted input; no official CI action hardening."}
    D09: {s: null, r: "N/A (no agent-written memory feature documented; AGENTS.md guidance files are user-authored instructions, threads are server-side history)."}
    D10: {s: 1, f: [0], r: "Subagents documented without any permission or environment scoping."}
    D11: {s: 2, f: [0, 1], r: "Server-side thread storage of tool calls/results with a data-management API export; enterprise audit logs cover auth events only, full audit logs on request."}
    D12: {s: 2, f: [0, 2, 3], r: "Training opt-in (never on Enterprise), deletion within 30 days, minimal provider retention. Thread storage is the service function (see e1_notes). Not 3: no residency/zero-retention option or admin enforcement documented."}
    D13: {s: 2, f: [0, 1], r: "Checksum files served with installers; auto-update can be disabled (AMP_SKIP_UPDATE_CHECK, updates.mode)."}
    D14: {s: 2, f: [0, 1], r: "Local and workspace managed settings with documented precedence; MCP registry allowlist; gap: no permission model to lock."}
    D15: {s: 1, f: [0, 1], r: "Disclosure contact and cash bounty, but no published advisories/CVEs."}
  antigravity:
    D01: {s: 1, f: [0, 2, 4, "D04.4", "D04.5"], r: "CLI default request-review asks and deny>ask>allow lists exist, but repo-controlled files can approve tool calls: .agents/hooks.json PreToolUse hooks may return auto_approve and repo custom agents declare their own commandExecutionPolicy. No central disable of --dangerously-skip-permissions."}
    D02: {s: 1, f: [0, 1, 3, 2], r: "Namespaces/Seatbelt sandbox is on only under the app Default preset; CLI enableTerminalSandbox and the IDE sandbox are off by default; workspace-only write scope not documented. Patched native-tool bypass (Pillar) noted."}
    D03: {s: 2, f: [0, 3, 4, 2], r: "URL fetch asks by default (CLI 1.1.28+), sandboxed commands have no network by default with read_url allowlist, browser allowlist starts at localhost. Not 3: no central allowlist management; unsandboxed commands unrestricted. Earlier webhook.site allowlist entry (3P) fixed."}
    D04: {s: 1, f: [0, 1, 3, 5, 6], r: "CLI trust prompt exists and gates workspace hooks, but the docs do not show repo MCP config, custom agents or plugins as gated, and the hooks page documents no trust requirement."}
    D05: {s: 1, f: [0, 1, 3, 4], r: "Unconfigured MCP tools default to Ask with per-tool patterns, but no project-server approval, managed MCP allowlist or change detection is documented."}
    D06: {s: 1, f: [0, 2], r: "Plugins bundle MCP servers, hooks and binaries; workspace plugins in .agents/plugins activate for the project; no signing or vetting documented."}
    D07: {s: 1, f: [0, 1, 3, 2, 5], r: "Session tokens in the OS keyring but file fallback without D-Bus; MCP OAuth tokens in a plaintext JSON file (3P: mode 0644); no log retention documented; .env read block bypassed via terminal (3P)."}
    D08: {s: 1, f: [0, 1], r: "Headless soft-denies unapproved actions (safe default), but no official CI integration with minimal permissions or actor checks is documented, which score 2 requires."}
    D09: {s: 1, f: [0, 2], r: "Global rules files and 'knowledge items' persist in app-data dirs; no write confirmation, project scoping or off switch documented."}
    D10: {s: 1, f: [2, 3, 4], r: "Per-subagent commandExecutionPolicy (default sandbox), tools and mcpServers exist, but subagents inherit accept-edits and propagation of bypass is not documented; workaround of denied requests fixed in CLI 1.2.15."}
    D11: {s: 1, f: [0], r: "Local diagnostic log only; enterprise request/response logging to a GCP project exists but structured local tool-call logs are not documented (score-2 clause unmet)."}
    D12: {s: 1, f: [0, 1, 2], r: "Telemetry on by default with opt-out; Terms use interactions to improve products/ML by default with opt-out; retention not documented."}
    D13: {s: 2, f: [0, 1, 2, 3], r: "Installer verifies SHA-512 against a manifest; auto-update can be disabled (AGY_CLI_DISABLE_AUTO_UPDATE). Not 3: no signatures, provenance, SBOM or pinning."}
    D14: {s: 1, f: [0, 1, 2], r: "Enterprise identity, licensing and VPC-SC governance only; no managed settings or admin-enforced permission policy."}
    D15: {s: 0, f: [0, 3, 1], r: "Docs-level facts show no SECURITY.md/security.txt and no advisories or CVEs; the Google Bug Hunters VRP is cited only by third-party reports, which cannot raise a score."}
