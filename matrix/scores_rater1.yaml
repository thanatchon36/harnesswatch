    D02: {s: null, r: "N/A (not documented: the only fact is an unverified statement of absence)."}
    D03: {s: 0, f: [0], r: "No destination allowlist of any kind; only whole tools can be removed."}
    D04: {s: 0, f: [0, 1], r: "Project .augment/settings.json including hooks loads automatically for anyone in the repo; no trust concept (only an indexing confirmation)."}
