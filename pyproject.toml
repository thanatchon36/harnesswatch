[project]
name = "harnesswatch"
version = "0.1.0"
description = "Security audit toolkit for AI coding-agent harnesses: configs, MCP servers, instruction files, secrets residue, CI usage, and an inert canary prompt-injection benchmark."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Thanatchon Chongmankhong" }]
keywords = ["security", "ai-agents", "mcp", "prompt-injection", "sarif", "claude-code", "codex", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/thanatchon36/harnesswatch"
Issues = "https://github.com/thanatchon36/harnesswatch/issues"

[project.scripts]
harnesswatch = "harnesswatch.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pre-commit>=3.7",
]
docs = ["mkdocs-material>=9.5"]
experiments = ["matplotlib>=3.9"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harnesswatch"]

[tool.hatch.build.targets.wheel.force-include]
"rules" = "harnesswatch/_data/rules"

[tool.hatch.build.targets.sdist]
include = ["src", "rules", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S603", "S607", "E501"]  # ruff format owns line length; long regexes stay readable

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"experiments/**" = ["S101", "S108", "S311"]  # S108: paths inside sandbox containers
"bench/**" = ["S101", "S104", "S108", "S311"]
"src/harnesswatch/observe/**" = ["S104", "S108"]  # paths and binds inside the sandbox containers

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/harnesswatch"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "real_rules: use the repository rule pack and harness profiles instead of test data",
  "docker: needs a working Docker daemon (skipped otherwise)",
]

[tool.coverage.run]
source = ["harnesswatch"]
branch = true
omit = ["*/observe/sidecars/*"]  # run inside containers; covered by the docker-marked tests

[tool.coverage.report]
show_missing = true
skip_covered = true
