# Generated by phase1:G3 research on 2026-10-15; every fact has a source in `sources`.
id: kimi-cli
name: Kimi Code CLI (successor of the archived Python kimi-cli)
vendor: Moonshot AI
tier: A
license: MIT
open_source: true
status: analysed
version_analysed: 2.2.0
analysed_on: '2026-10-15'
homepage: https://moonshotai.github.io/kimi-code/en/
repo: https://github.com/MoonshotAI/kimi-code
binaries:
- kimi
packages:
- ecosystem: npm
  name: '@moonshot-ai/kimi-code'
- ecosystem: pypi
  name: kimi-cli
  note: legacy Python CLI 1.52.0, repo MoonshotAI/kimi-cli ARCHIVED 2026-09-22 (Apache-2.0); superseded
    by kimi-code
install_methods:
- method: curl-installer
  command: curl -fsSL https://code.kimi.com/kimi-code/install.sh | bash
  checksum_verified: null
  signed: null
  source: https://github.com/MoonshotAI/kimi-code/blob/main/README.md
- method: powershell
  command: irm https://code.kimi.com/kimi-code/install.ps1 | iex
  source: https://github.com/MoonshotAI/kimi-code/blob/main/README.md
- method: npm
  command: npm install -g @moonshot-ai/kimi-code
  source: https://github.com/MoonshotAI/kimi-code/blob/main/docs/en/guides/getting-started.md
  note: see Getting Started; exact command unverified
auto_update:
  default: true
  config: 'tui.toml [upgrade] auto_install = false (legacy: KIMI_CLI_NO_AUTO_UPDATE=1)'
  source: https://github.com/MoonshotAI/kimi-code/blob/main/docs/en/configuration/data-locations.md
state_dirs:
- ~/.kimi-code
- $KIMI_CODE_HOME
- ~/.kimi (legacy kimi-cli; migrated by `kimi migrate`)
- ~/.agents (shared skills/AGENTS.md)
credential_files:
- ~/.kimi-code/credentials/*.json
- ~/.kimi-code/credentials/mcp/*.json
- ~/.kimi-code/config.toml (api_key field, plaintext if used)
credential_storage: OAuth credentials in ~/.kimi-code/credentials (dir 0700, files 0600, atomic writes);
  API keys may be written in plaintext in config.toml `api_key` or read via `api_key_env`; no OS keychain
  documented.
log_paths:
- ~/.kimi-code/sessions/<workDirKey>/<sessionId>/**
- ~/.kimi-code/session_index.jsonl
- ~/.kimi-code/user-history/*.jsonl
- ~/.kimi-code/logs/kimi-code.log
memory_paths: []
config_files:
- path: ~/.kimi-code/config.toml
  scope: user
  format: toml
  kind: settings
- path: ~/.kimi-code/tui.toml
  scope: user
  format: toml
  kind: settings
- path: .kimi-code/local.toml
  scope: project-local
  format: toml
  kind: settings
  note: only [workspace] additional_dir
- path: ~/.kimi-code/mcp.json
  scope: user
  format: json
  kind: mcp
- path: .kimi-code/mcp.json
  scope: project
  format: json
  kind: mcp
  note: enabled only after workspace trust
- path: ~/.kimi-code/AGENTS.md
  scope: user
  format: markdown
  kind: instructions
- path: ~/.kimi-code/plugins/installed.json
  scope: user
  format: json
  kind: settings
- path: .kimi-code/skills/
  scope: project
  format: markdown
  kind: skills
- path: .agents/skills/
  scope: project
  format: markdown
  kind: skills
- path: ~/.kimi-code/skills/
  scope: user
  format: markdown
  kind: skills
instruction_files:
- AGENTS.md
- ~/.kimi-code/AGENTS.md
- ~/.agents/AGENTS.md
skills_paths:
- .kimi-code/skills
- .agents/skills
- ~/.kimi-code/skills
- ~/.agents/skills
mcp:
  files:
  - ~/.kimi-code/mcp.json
  - .kimi-code/mcp.json
  servers_key: mcpServers
  server_fields:
    command: command
    args: args
    env: env
    url: url
    headers: headers
    type: transport/type (unverified spelling)
  project_servers_require_approval: true
  notes: Workspace trust prompt lists each project MCP server's transport and launch target; prompt defaults
    to 'Trust this folder'. Headless runs cannot prompt, so project MCP stays disabled unless the workspace
    is already trusted or KIMI_CODE_TRUST_WORKSPACE=1. In Ask When Needed mode MCP tool calls are auto-approved.
permissions:
  config_keys:
    mode: default_permission_mode (manual | yolo | auto)
    rules: '[[permission.rules]] decision=allow|deny|ask, pattern=''Tool'' or ''Tool(arg-glob)'', scope=user|project|session-runtime|turn-override'
    guard: permission.dangerous_command_guard (default true)
  default_mode: 'manual (UI label ''Always Ask'': reads auto, edits/commands ask)'
  auto_approve_values:
  - key: default_permission_mode
    value: yolo
    note: UI 'Ask When Needed' - auto-approves regular calls; still asks for sensitive files, dangerous commands, plan exit
  - key: default_permission_mode
    value: auto
    note: UI 'Never Ask' - approves everything incl. sensitive files; dangerous_command_guard inactive
  - key: permission.dangerous_command_guard
    value: 'false'
  cli_flags_auto_approve:
  - --yolo / -y
  - --auto
  - -p/--prompt (non-interactive implies `auto` permission)
  allow_rule_syntax: '[[permission.rules]] decision = "allow" pattern = "Bash(git status*)"  (one TOML
    table per rule)'
  overbroad_patterns:
  - pattern = "Bash"
  - pattern = "Bash(*)"
  - pattern = "*"
  notes: 'Legacy 1.x names: --yolo auto-approved everything; --print implied --afk. Names changed in 2.x
    (Manual->Always Ask, YOLO->Ask When Needed, Auto->Never Ask).'
hooks:
  supported: true
  config_key: hooks   # [[hooks]] array of tables in ~/.kimi-code/config.toml; fields event, matcher, command, timeout; events include PreToolUse
  repo_scoped_allowed: false
  command_field: command
  notes: 'Hooks are user-level only (no project-level hook file found). Fail-open: hook errors/timeouts
    allow the action; exit code 2 blocks.'
sandbox:
  available: false
  default_on: false
  mechanism: none documented (unverified); dangerous-command guard + approval only
  config: null
  source: https://github.com/MoonshotAI/kimi-code/blob/main/docs/en/guides/interaction.md
network:
  domain_allowlist: false
  config: null
  default: unrestricted (built-in web fetch/search services via Kimi endpoints)
  source: https://github.com/MoonshotAI/kimi-code/blob/main/docs/en/configuration/config-files.md
workspace_trust:
  prompt_on_new_folder: true
  notes: 'Workspace trust prompt appears when an untrusted folder has project-level MCP servers; headless:
    disabled unless trusted / KIMI_CODE_TRUST_WORKSPACE=1. Project skills and AGENTS.md load without a
    documented prompt.'
  source: https://github.com/MoonshotAI/kimi-code/blob/main/docs/en/customization/mcp.md
memory:
  persistent: false
  cross_project: false
  agent_writable: null
  notes: No persistent memory feature found in docs (unverified).
  source: https://github.com/MoonshotAI/kimi-code/blob/main/docs/en/guides/sessions.md
subagents:
  supported: true
  inherits_permissions: null
  notes: Built-in coder, explore, plan subagents in isolated contexts; custom agents via ~/.kimi-code/agents
    and extra_agent_dirs. Permission inheritance not verified.
  source: https://github.com/MoonshotAI/kimi-code/blob/main/docs/en/customization/agents.md
telemetry:
  default_on: true
  opt_out: KIMI_DISABLE_TELEMETRY=1 or config.toml `telemetry = false`
  training_default: unverified
  source: https://github.com/MoonshotAI/kimi-code/blob/main/docs/en/configuration/env-vars.md
headless:
  command: kimi -p "<prompt>"
  flags:
  - -p/--prompt
  - --output-format text|stream-json
  - -m/--model <alias>
  - --agent-file
  - --plan (not with -p)
  ci_integrations: []
  model_override: -m <alias from config.toml [models]>; or env KIMI_MODEL_NAME + KIMI_MODEL_API_KEY +
    KIMI_MODEL_BASE_URL + KIMI_MODEL_PROVIDER_TYPE=openai (temporary in-memory provider)
  local_model_support: 'Yes: provider type `openai` (Chat Completions) or `openai_responses` with base_url,
    e.g. KIMI_MODEL_NAME=<ollama-model> KIMI_MODEL_PROVIDER_TYPE=openai KIMI_MODEL_BASE_URL=http://localhost:11434/v1
    KIMI_MODEL_API_KEY=ollama KIMI_MODEL_MAX_CONTEXT_SIZE=...; env credentials otherwise NOT read automatically'
  notes: -p runs with `auto` permission policy (no approval requested; static deny rules remain in effect);
    cannot be combined with --yolo/--auto/--plan.
security_policy:
  security_md: https://github.com/MoonshotAI/kimi-code/blob/main/SECURITY.md
  bug_bounty: null
  advisories: https://github.com/MoonshotAI/kimi-code/security/advisories
  notes: Only latest release gets security support; 0 published advisories for kimi-code and kimi-cli
    at access time.
extra:
  repo_history: MoonshotAI/kimi-cli (Python, Apache-2.0, v1.52.0 2026-09-22) is ARCHIVED; README points
    to MoonshotAI/kimi-code (TypeScript, MIT, single binary, v2.2.0). MISSION lists 'Kimi CLI, Apache-2.0,
    Python' -- outdated for the current product; legacy data in ~/.kimi migrated by `kimi migrate`.
  legacy_kimi_cli:
    config: ~/.kimi/config.toml
    env: KIMI_SHARE_DIR, KIMI_CLI_NO_AUTO_UPDATE
    headless: kimi --print (implies --afk), --quiet
    yolo: --yolo/--yes/--auto-approve
  web_server: '`kimi web` serves REST/WebSocket UI on loopback with #token= URL fragment credential; KIMI_CODE_PASSWORD
    recommended when binding beyond loopback; `kimi web rotate-token`'
