extra:
  mission_corrections: "MISSION seed `.agent/` is legacy: current repo dir is `.agents/` (rules, skills, hooks.json, mcp_config.json, agents/, plugins/, rules.json); `.agent/rules/` and `.agent/skills/` are still read. `.agent/workflows` is not in current docs; workflows (.agents/workflows) stop working 2026-10-19 and migrate to skills. MISSION terms 'Auto'/'Turbo': 'Auto' was the Nov-2025 IDE terminal policy (PromptArmor, Embrace The Red) and is now a CLI --mode (1.3.5); 'Turbo' is an app preset; the current IDE uses Request Review / Always Proceed. 'Secure Mode' (IDE 1.11.17, 2025-12-08) was renamed 'strict mode' in IDE 1.16.5 (2026-02-03). There is no --yolo flag; the equivalent is --dangerously-skip-permissions."
  conditional_auto_approve:
    - {key: "toolPermission", value: "proceed-in-sandbox", note: "auto-runs sandboxed commands only; vendor-recommended unattended mode (issue #36 reply). Flag only together with enableTerminalSandbox=false (behaviour then undocumented)."}
    - {key: "agentMode", value: "accept-edits", note: "auto-approves file edits only; commands still governed by toolPermission"}
    - {key: "agentMode", value: "auto", note: "CLI 1.3.5: approves edits and 'safe' commands; out-of-sandbox commands reviewed by a separate agent"}
  hosts_documented_or_seen:
    - {host: antigravity.google, role: "installer script", source: install.sh}
    - {host: antigravity-cli-auto-updater-974169037036.us-central1.run.app, role: "update manifest", source: install.sh}
    - {host: storage.googleapis.com, role: "binary payload (bucket antigravity-public)", source: "updater manifest"}
    - {host: generativelanguage.googleapis.com, role: "model API in GEMINI_API_KEY mode (inferred from 'requests go directly to the Gemini API'; unverified)", source: https://antigravity.google/docs/cli/install}
  linter_risky_snippets:
    - '{"toolPermission": "always-proceed"}   # ~/.gemini/antigravity-cli/settings.json'
    - '{"toolPermission": "proceed-in-sandbox", "enableTerminalSandbox": false}   # misleading: auto-run without sandbox?'
    - '{"allowNonWorkspaceAccess": true}'
    - '{"permissions": {"allow": ["mcp(*)", "command(*)", "unsandboxed(*)"]}}'
    - '{"enableTelemetry": false} is the privacy-positive spelling'
    - '.agents/hooks.json with PreToolUse handlers that print {"decision": "auto_approve"} (repo-controlled pre-approval)'
    - '.agents/mcp_config.json with {"mcpServers": {"x": {"command": "...", "serverUrl": "http://..."}}} in a repo'
    - '.agents/agents/<name>.md front matter with mcpServers / commandExecutionPolicy: eager'
    - 'agy --sandbox --dangerously-skip-permissions   # sandbox bypass requests are auto-approved too'
