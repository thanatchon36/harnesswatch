# Generated by phase1:G3 research on 2026-10-15; every fact has a source in `sources`.
id: hermes-agent
name: Hermes Agent
vendor: Nous Research
tier: A
license: MIT
open_source: true
status: analysed
version_analysed: 0.22.1
analysed_on: '2026-10-15'
homepage: https://hermes-agent.nousresearch.com
repo: https://github.com/NousResearch/hermes-agent
binaries:
- hermes
packages:
- ecosystem: pypi
  name: hermes-agent
install_methods:
- method: curl-installer
  command: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
  checksum_verified: null
  signed: null
  source: https://github.com/NousResearch/hermes-agent/blob/main/README.md
- method: powershell
  command: iex (irm https://hermes-agent.nousresearch.com/install.ps1)
  source: https://github.com/NousResearch/hermes-agent/blob/main/README.md
- method: termux-apt
  command: signed APT repository (stable/canary channels)
  signed: true
  source: https://github.com/NousResearch/hermes-agent/blob/main/README.md
- method: docker
  command: Dockerfile / docker-compose.yml in repo
  source: https://github.com/NousResearch/hermes-agent/blob/main/README.md
auto_update:
  default: null
  config: '`hermes update` (explicit); updates.pre_update_backup: quick|full|off'
  source: https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/configuration.md
state_dirs:
- ~/.hermes
- $HERMES_HOME
- /etc/hermes (managed scope)
- '%LOCALAPPDATA%\hermes (native Windows)'
credential_files:
- ~/.hermes/.env
- ~/.hermes/auth.json
- ~/.hermes/.anthropic_oauth.json
- ~/.hermes/auth/google_oauth.json
- ~/.hermes/vault/
- ~/.hermes/mcp-tokens/
- ~/.hermes/pairing/
- ~/.hermes/browser-profile/
credential_storage: 'Plaintext .env (docs: chmod 600; `hermes config set KEY` routes secrets to .env),
  auth.json for OAuth providers, credential vault (0600, per profile), optional Bitwarden/1Password/command
  secret backends. Subprocess env is scrubbed of provider keys by default; log output redacted.'
log_paths:
- ~/.hermes/logs/errors.log
- ~/.hermes/logs/gateway.log
- ~/.hermes/sessions/**
- ~/.hermes/state.db
memory_paths:
- ~/.hermes/memories/MEMORY.md
- ~/.hermes/memories/USER.md
- ~/.hermes/SOUL.md
- ~/.hermes/skills/
config_files:
- path: ~/.hermes/config.yaml
  scope: user
  format: yaml
  kind: settings
- path: ~/.hermes/.env
  scope: user
  format: env
  kind: settings
- path: /etc/hermes/config.yaml
  scope: managed
  format: yaml
  kind: settings
- path: /etc/hermes/.env
  scope: managed
  format: env
  kind: settings
- path: ~/.hermes/SOUL.md
  scope: user
  format: markdown
  kind: instructions
- path: .hermes.md
  scope: project
  format: markdown
  kind: instructions
- path: HERMES.md
  scope: project
  format: markdown
  kind: instructions
- path: AGENTS.md
  scope: project
  format: markdown
  kind: instructions
- path: CLAUDE.md
  scope: project
  format: markdown
  kind: instructions
- path: .cursorrules
  scope: project
  format: markdown
  kind: instructions
- path: .hermes/plugins/
  scope: project
  format: markdown
  kind: hooks
  note: disabled unless HERMES_ENABLE_PROJECT_PLUGINS=true
- path: ~/.hermes/hooks/*/HOOK.yaml
  scope: user
  format: yaml
  kind: hooks
  note: 'gateway hooks: trusted-by-placement, handler.py imported in-process'
- path: ~/.hermes/skills/
  scope: user
  format: markdown
  kind: skills
- path: ~/.hermes/profiles/<name>/
  scope: user
  format: yaml
  kind: settings
  note: multi-profile; path layout unverified
instruction_files:
- .hermes.md
- HERMES.md
- AGENTS.md
- CLAUDE.md
- .cursorrules
- SOUL.md
skills_paths:
- ~/.hermes/skills
- optional-skills/ (repo)
- .hermes/plugins/ (project plugins, opt-in)
mcp:
  files:
  - ~/.hermes/config.yaml
  - /etc/hermes/config.yaml
  servers_key: mcp_servers
  server_fields:
    command: command
    args: args
    env: env
    url: url
    headers: headers
    type: '(inferred from command vs url; auth: oauth supported)'
    tools: tools.include / tools.exclude
  project_servers_require_approval: null
  notes: MCP servers are defined only in config.yaml (user/managed), not in repo files; first-use consent
    prompts exist for MCP trust and elicitation (approval surfaces `mcp-trust/<server>`, `mcp-elicitation/<server>`).
    `hermes import-agent claude-code` migrates ~/.claude.json mcpServers. mcp_reload_confirm=true by default.
permissions:
  config_keys:
    mode: approvals.mode (smart | manual | off)
    timeout: approvals.timeout
    headless: approvals.cron_mode / approvals.single_query_mode / approvals.unattended_mode (deny | approve)
    deny: approvals.deny (glob list, enforced before yolo)
    allow: command_allowlist
    memory_gate: memory.write_approval
  default_mode: approvals.mode = smart (auxiliary LLM auto-approves low-risk and auto-denies dangerous
    commands; uncertain => prompt); headless modes deny
  auto_approve_values:
  - key: approvals.mode
    value: 'off'
  - key: approvals.cron_mode
    value: approve
  - key: approvals.single_query_mode
    value: approve
  - key: approvals.unattended_mode
    value: approve
  - key: env HERMES_YOLO_MODE
    value: '1'
  - key: env GATEWAY_ALLOW_ALL_USERS
    value: 'true (authorization, not approval: lets any chat user drive the agent)'
  cli_flags_auto_approve:
  - --yolo
  - /yolo (in-session toggle)
  allow_rule_syntax: 'command_allowlist: ["<pattern>"]  # added via ''always'' at an approval prompt'
  overbroad_patterns:
  - 'approvals.mode: off'
  - 'approvals.cron_mode: approve'
  - GATEWAY_ALLOW_ALL_USERS=true
  - <PLATFORM>_ALLOW_ALL_USERS=true
  - WHATSAPP_ALLOWED_USERS=*
  notes: 'SECURITY.md: the approval gate is an in-process heuristic, not a boundary; the only boundary
    is the OS (container/whole-process wrapping). A hardline blocklist (unrecoverable commands) applies
    even under --yolo.'
hooks:
  supported: true
  config_key: hooks   # config.yaml shell hooks; per-(event,command) first-use consent, hooks_auto_accept: false, --accept-hooks; also plugin hooks (plugins.enabled) and gateway hooks dir
  repo_scoped_allowed: false
  command_field: command
  notes: Shell hooks consent keys on command string not script hash (script edits silently trusted); gateway
    hooks load by placement.
sandbox:
  available: true
  default_on: false
  mechanism: 'pluggable terminal backends: local (default, host), docker (hardened), ssh, modal, daytona,
    singularity; whole-process wrapping via Docker image/Compose or NVIDIA OpenShell; optional iron-proxy
    egress credential-injection proxy (Docker backend only)'
  config: terminal.backend (e.g. docker)
  source: https://github.com/NousResearch/hermes-agent/blob/main/SECURITY.md
network:
  domain_allowlist: true
  config: 'optional iron-proxy ~/.hermes/proxy/proxy.yaml (allowed upstream hosts) for Docker backend;
    Docker network segmentation guide; default Docker network_mode: host is unrestricted'
  default: unrestricted
  source: https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/egress/iron-proxy.md
workspace_trust:
  prompt_on_new_folder: false
  notes: No folder-trust prompt. Project plugins (.hermes/plugins) are opt-in via HERMES_ENABLE_PROJECT_PLUGINS=true;
    project context files (.hermes.md/AGENTS.md/CLAUDE.md/.cursorrules) are loaded after an injection
    scan (prompt_builder._scan_context_content, itself the subject of CVE-2026-9366).
  source: https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/features/plugins.md
memory:
  persistent: true
  cross_project: true
  agent_writable: true
  notes: MEMORY.md (agent notes) and USER.md (user profile) injected as frozen snapshot at session start;
    written by the agent via `memory` tool; memory.write_approval (default false) gates writes outside
    CLI; memory content is scanned for injection (_scan_memory_content; CVE-2026-10223). Pluggable memory
    providers (honcho etc.).
  source: https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/features/memory.md
subagents:
  supported: true
  inherits_permissions: children inherit the parent's enabled toolsets (model cannot grant more); isolated
    context and own terminal sessions; credentials may be pinned via delegation.provider
  notes: Also kanban multi-agent, a2a messaging.
  source: https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/features/delegation.md
telemetry:
  default_on: null
  opt_out: no telemetry switch documented; docs state only 'no additional telemetry request' for the Codex
    identity header (unverified overall)
  training_default: n/a
  source: https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/configuration.md
headless:
  command: hermes chat -q "<prompt>"
  flags:
  - -q/--query
  - --query-file PATH|-
  - hermes -z (unattended one-shot)
  - --yolo
  - --accept-hooks
  ci_integrations: []
  model_override: 'config.yaml `model: {default: <id>, provider: custom, base_url: <url>}`; `hermes setup`
    -> Custom Endpoint; `hermes config set model <id>`'
  local_model_support: 'Yes: provider custom with base_url http://localhost:11434/v1 (documented Ollama
    guide); also llama.cpp via desktop Local Models'
  notes: 'approvals.single_query_mode=deny by default: -q sessions block dangerous commands rather than
    prompting.'
security_policy:
  security_md: https://github.com/NousResearch/hermes-agent/blob/main/SECURITY.md
  bug_bounty: null
  advisories: https://github.com/NousResearch/hermes-agent/security/advisories
  notes: security@nousresearch.com or GHSA; explicit 'no bug bounty'. Policy defines OS-level isolation
    as the only boundary and lists in-process heuristics (approval gate, redaction, Skills Guard) as non-boundaries.
extra:
  gateway_authorization_order: per-platform allow-all flag > DM pairing list > platform allowlists (<PLATFORM>_ALLOWED_USERS)
    > GATEWAY_ALLOWED_USERS > GATEWAY_ALLOW_ALL_USERS > default deny
  gateway_env_note: gateway sets HERMES_EXEC_ASK=1 automatically
  scheduler: 'cron jobs (cron_mode: deny when a dangerous command is hit)'
  cve_note: 10 GitHub-reviewed advisories (CVE-2026-9353..9369, 10221..10224, 53869, 53870); several are
    VulDB-style reports with versions 'up to 2026.4.x'/'<=0.19.0'; pip fixed_version missing for two.
  version_scheme: PyPI/GH release v0.22.1; advisories also cite date versions (2026.4.30)
