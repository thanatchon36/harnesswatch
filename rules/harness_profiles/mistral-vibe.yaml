# Generated by phase1:G3 research on 2026-10-15; every fact has a source in `sources`.
id: mistral-vibe
name: Mistral Vibe
vendor: Mistral AI
tier: A
license: Apache-2.0
open_source: true
status: analysed
version_analysed: 2.26.1
analysed_on: '2026-10-15'
homepage: https://github.com/mistralai/mistral-vibe
repo: https://github.com/mistralai/mistral-vibe
binaries:
- vibe
- vibe-acp
packages:
- ecosystem: pypi
  name: mistral-vibe
install_methods:
- method: curl-installer
  command: curl -LsSf https://mistral.ai/vibe/install.sh | bash
  checksum_verified: null
  signed: null
  source: https://github.com/mistralai/mistral-vibe/blob/main/README.md
- method: uv
  command: uv tool install mistral-vibe
  source: https://github.com/mistralai/mistral-vibe/blob/main/README.md
- method: pip
  command: pip install mistral-vibe
  source: https://github.com/mistralai/mistral-vibe/blob/main/README.md
auto_update:
  default: true
  config: enable_update_checks = false (config.toml); daily check, prompts before install; `vibe --check-upgrade`
  source: https://github.com/mistralai/mistral-vibe/blob/main/README.md
state_dirs:
- ~/.vibe
- $VIBE_HOME
credential_files:
- ~/.vibe/.env
- ~/.vibe/trusted_folders.toml (trust decisions, 0600)
credential_storage: API keys saved by `vibe --setup` to ~/.vibe/.env (created mode 0600, group/other bits
  stripped in source); env vars take precedence; MCP OAuth tokens stored by Vibe (location unverified).
  No OS keychain.
log_paths:
- ~/.vibe/logs/vibe.log
- ~/.vibe/shell-tool/sessions/**
memory_paths: []
config_files:
- path: ~/.vibe/config.toml
  scope: user
  format: toml
  kind: settings
- path: .vibe/config.toml
  scope: project
  format: toml
  kind: settings
  note: loaded only for trusted folders (trusted_folders.toml)
- path: ~/.vibe/hooks.toml
  scope: user
  format: toml
  kind: hooks
- path: .vibe/hooks.toml
  scope: project
  format: toml
  kind: hooks
  note: trusted folders only; loaded first
- path: ~/.vibe/agents/*.toml
  scope: user
  format: toml
  kind: agents
- path: .vibe/agents/*.toml
  scope: project
  format: toml
  kind: agents
- path: ~/.vibe/skills/
  scope: user
  format: markdown
  kind: skills
- path: .vibe/skills/
  scope: project
  format: markdown
  kind: skills
- path: .agents/skills/
  scope: project
  format: markdown
  kind: skills
- path: .vibe/tools/
  scope: project
  format: markdown
  kind: settings
  note: custom Python tools (to be deprecated)
- path: .vibe/plugins/
  scope: project
  format: markdown
  kind: settings
- path: .vibe/prompts/
  scope: project
  format: markdown
  kind: instructions
- path: ~/.vibe/AGENTS.md
  scope: user
  format: markdown
  kind: instructions
- path: ~/.vibe/trusted_folders.toml
  scope: user
  format: toml
  kind: settings
- path: ~/.vibe/.env
  scope: user
  format: env
  kind: settings
instruction_files:
- AGENTS.md
- ~/.vibe/AGENTS.md
skills_paths:
- .vibe/skills
- .agents/skills
- ~/.vibe/skills
- ~/.agents/skills
mcp:
  files:
  - ~/.vibe/config.toml
  - .vibe/config.toml
  servers_key: mcp_servers
  server_fields:
    name: name
    command: command
    args: args
    env: env
    url: url
    headers: headers
    type: transport   # stdio | http | streamable-http
    auth: auth.type (static | oauth), api_key_env, api_key_header, api_key_format
  project_servers_require_approval: true
  notes: TOML array of tables `[[mcp_servers]]`. Project .vibe/config.toml is only read for trusted folders.
    `vibe mcp add` writes user config.
permissions:
  config_keys:
    default_agent: default_agent (ask | plan | accept-edits | auto-approve | lean | custom agent file
      name)
    tool_permission: '[tools.<name>] permission = "ask" | "always" | "never" (also allowlist/denylist,
      sensitive_patterns)'
    global_bypass: bypass_tool_permissions (bool, default false)
    tool_filter: 'enabled_tools / disabled_tools (glob or re: regex)'
  default_mode: 'agent `accept-edits`: auto-approves write_file/edit only; shell and other tools ask'
  auto_approve_values:
  - key: default_agent
    value: auto-approve
  - key: bypass_tool_permissions
    value: 'true'
  - key: tools.<name>.permission
    value: always
  cli_flags_auto_approve:
  - --auto-approve
  - --yolo
  allow_rule_syntax: '[tools.bash] permission = "ask"  (TOML table; allowlist/denylist keys per tool)'
  overbroad_patterns:
  - '[tools.bash] permission = "always"'
  - default_agent = "auto-approve"
  - bypass_tool_permissions = true
  notes: 'Built-in agents: ask (approval for tools), plan (read-only), accept-edits (default), auto-approve.
    Custom agent TOML can override tool permissions. `default_agent` applies to -p sessions too.'
hooks:
  supported: true
  config_key: '[[hooks]] in hooks.toml (name, type = pre_tool | post_tool | post_agent, match, command,
    timeout, strict)'
  repo_scoped_allowed: true
  command_field: command
  notes: Project .vibe/hooks.toml honoured only in trusted folders; project hooks load first and win on
    name collision; subagents inherit hooks. Hook failures fail open unless strict=true.
sandbox:
  available: false
  default_on: false
  mechanism: none built in for local sessions; experimental hidden --agent-socket mode delegates tools
    to an external sandbox server
  config: null
  source: https://github.com/mistralai/mistral-vibe/blob/main/README.md
network:
  domain_allowlist: false
  config: enable_system_trust_store, SSL_CERT_FILE (TLS only)
  default: unrestricted
  source: https://github.com/mistralai/mistral-vibe/blob/main/README.md
workspace_trust:
  prompt_on_new_folder: true
  notes: 'Trust-folder system: .vibe/config, hooks, AGENTS.md, skills, tools, agents, prompts are loaded
    only for trusted folders; decisions in ~/.vibe/trusted_folders.toml; `--trust` trusts cwd for one
    invocation (for automation); --worktree and --add-dir imply trust.'
  source: https://github.com/mistralai/mistral-vibe/blob/main/README.md
memory:
  persistent: false
  cross_project: false
  agent_writable: null
  notes: No persistent memory feature found in README (sessions only).
  source: https://github.com/mistralai/mistral-vibe/blob/main/README.md
subagents:
  supported: true
  inherits_permissions: subagents inherit parent hook config; built-in `explore` subagent is read-only;
    custom subagents via agent_type = "subagent"
  notes: Delegation via `task` tool.
  source: https://github.com/mistralai/mistral-vibe/blob/main/README.md
telemetry:
  default_on: true
  opt_out: enable_telemetry = false in config.toml (also gates OTel); OTel tracing opt-in via enable_otel
    = true with default redaction
  training_default: unverified (Mistral Privacy Policy referenced)
  source: https://github.com/mistralai/mistral-vibe/blob/main/README.md
  notes: README also mentions server-managed GrowthBook experiments (e.g. vibe_cli_managed_shell_tools).
headless:
  command: vibe -p "<prompt>" --output json
  flags:
  - -p/--prompt
  - --prompt-file PATH
  - --output text|json|streaming
  - --auto-approve/--yolo
  - --agent NAME
  - --enabled-tools
  - --disabled-tools
  - --max-turns
  - --max-price
  - --max-tokens
  - --time-limit
  - --output-dir
  - --trust
  - --workdir
  ci_integrations:
  - 'mistralai/mistral-vibe (composite GitHub Action, action.yml: runs `vibe -p` with MISTRAL_API_KEY
    input; prompt passed via env var)'
  model_override: config.toml [[providers]] (name, api_base, api_key_env_var, api_style, backend) + [[models]]
    (name, provider, alias); `active_model = "<alias>"`
  local_model_support: 'Yes: built-in provider `llamacpp` at http://127.0.0.1:8080/v1; any OpenAI-compatible
    endpoint via [[providers]] api_base (Ollama http://localhost:11434/v1 expected; not tested)'
  notes: 'Exit codes 0 finished, 1 usage/config, 2 infra, 3 limit/refusal, 4 aborted. In -p mode the default
    agent accept-edits still asks for shell: behaviour of an unanswerable ask in -p not verified.'
security_policy:
  security_md: https://github.com/mistralai/mistral-vibe/blob/main/SECURITY.md
  bug_bounty: null
  advisories: https://github.com/mistralai/mistral-vibe/security/advisories
  notes: Report privately to security@mistral.ai; 0 published advisories at access time.
extra:
  mission_check: MISSION seed `~/.vibe/config.toml` is correct; project-level `./.vibe/config.toml` is
    checked first (trusted folders only). Vibe also ships a Rust TUI/'Unified Harness' runtime (VIBE_CLI=rust)
    and `--legacy-harness`.
