# Generated by phase1:G3 research on 2026-10-15; every fact has a source in `sources`.
id: deepseek-harness
name: DeepSeek Harness (dsh)
vendor: DeepSeek AI
tier: A
license: MIT
open_source: true
status: analysed
version_analysed: 0.2.1-alpha.3
analysed_on: '2026-10-15'
homepage: https://deepseek-harness.github.io/deepseek-harness/
repo: https://github.com/deepseek-ai/deepseek-harness
binaries:
- dsh
packages:
- ecosystem: npm
  name: '@deepseek-ai/dsh'
install_methods:
- method: npx
  command: npx @deepseek-ai/dsh web
  checksum_verified: null
  signed: null
  source: https://github.com/deepseek-ai/deepseek-harness/blob/master/README.md
- method: source
  command: git clone ... && pnpm install && pnpm run build && pnpm dsh web
  source: https://github.com/deepseek-ai/deepseek-harness/blob/master/README.md
- method: desktop-app
  command: Electron desktop app (signed resources); community Tauri forks exist and are NOT official
  source: https://github.com/deepseek-ai/deepseek-harness/blob/master/apps/cli/README.md
auto_update:
  default: null
  config: not found in CLI docs (unverified); plugin updates only via `dsh plugin ... update`
  source: https://github.com/deepseek-ai/deepseek-harness/blob/master/apps/cli/README.md
state_dirs:
- ~/.dsh
- $DSH_HOME
credential_files:
- $DSH_HOME/.credentials.yaml
- <project>/.env
- $DSH_HOME/.env
credential_storage: 'Private YAML file in the harness home (docs say only the OS user can read it; agent
  tool processes run as the same user, so it cannot isolate secrets from the agent). Lookup precedence:
  stored file, launch env, project .env, home .env. Web UI keys are write-only.'
log_paths:
- $DSH_HOME/sessions/**
memory_paths: []
config_files:
- path: $DSH_HOME/profiles/<profile>/cordis.patch.yml
  scope: user
  format: yaml
  kind: settings
- path: $DSH_HOME/profiles/<profile>/package.json
  scope: user
  format: json
  kind: settings
- path: $DSH_HOME/cordis.patch.yml
  scope: user
  format: yaml
  kind: settings
- path: $DSH_HOME/AGENTS.md
  scope: user
  format: markdown
  kind: instructions
- path: ~/.agents/AGENTS.md
  scope: user
  format: markdown
  kind: instructions
- path: AGENTS.md
  scope: project
  format: markdown
  kind: instructions
- path: CLAUDE.md
  scope: project
  format: markdown
  kind: instructions
- path: .dsh/skills/*/SKILL.md
  scope: project
  format: markdown
  kind: skills
- path: .agents/skills/*/SKILL.md
  scope: project
  format: markdown
  kind: skills
instruction_files:
- AGENTS.md
- CLAUDE.md
- AGENTS.local.md
- CLAUDE.local.md
skills_paths:
- .dsh/skills
- .agents/skills
- $DSH_HOME/skills
- ~/.agents/skills
mcp:
  files:
  - $DSH_HOME/profiles/<profile>/cordis.patch.yml
  - $DSH_HOME/cordis.patch.yml
  servers_key: 'plugin rows: `- id: <x>` / `name: ''@deepseek-ai/dsh-mcp-client''` / `config: {...}` (one
    plugin row per MCP server; NOT a name->server map)'
  server_fields:
    command: config.command
    args: config.args
    env: config.env
    url: config.url
    headers: config.headers
    type: config.transport (stdio | streamable-http)
    name: config.serverName
  project_servers_require_approval: null
  notes: No MCP server enabled by default. MCP is configured only in profile/home patch files under $DSH_HOME,
    not in repo files (no repo-level MCP file found). stdio env is merged over a scrubbed ambient env.
    Optional examples in apps/cli/config/examples/.
permissions:
  config_keys:
    sandbox_mode_default: row `@deepseek-ai/dsh-sandbox-policy` config.mode (read-only | workspace-write
      | danger-full-access); base bundle sets it from env DSH_PERMISSION_MODE, default workspace-write
    approval_policy: row `@deepseek-ai/dsh-user-approval` config.policy (ask | never)
    presets: row `@deepseek-ai/dsh-permission-presets` config.presets / config.defaultPreset
  default_mode: workspace-write sandbox + approval ask (preset workspace-write)
  auto_approve_values:
  - key: env DSH_PERMISSION_MODE
    value: danger-full-access (base bundle then sets approval policy to `never` AND sandbox to full access)
  - key: '@deepseek-ai/dsh-user-approval config.policy'
    value: 'never (note: `never` REJECTS requests, it does not approve; with sandbox danger-full-access
      nothing is gated)'
  - key: '@deepseek-ai/dsh-permission-presets preset'
    value: 'danger-full-access {sandbox: danger-full-access, approval: never}'
  - key: '@deepseek-ai/dsh-sandbox-policy config.mode'
    value: danger-full-access
  cli_flags_auto_approve: []
  allow_rule_syntax: null
  overbroad_patterns:
  - 'mode: danger-full-access'
  - 'defaultPreset: danger-full-access'
  - DSH_PERMISSION_MODE=danger-full-access
  notes: 'No per-command allow/deny list was found: policy is (sandbox file-effect mode) x (approval ask|never).
    Approval seam fails closed when no answerer is mounted (headless => unavailable => denied).'
hooks:
  supported: null
  config_key: null
  repo_scoped_allowed: false
  command_field: null
  notes: No shell-command hook mechanism found; extension model is Cordis plugins (in-process JS) loaded
    from profile packages. unverified whether a hooks plugin exists.
sandbox:
  available: true
  default_on: true
  mechanism: bwrap then Landlock (Linux); Seatbelt (macOS); ACL restricted-token (Windows, partial). Fails
    closed with SANDBOX_UNAVAILABLE. File-effect policy only; no network/process policy.
  config: '@deepseek-ai/dsh-sandbox-policy config.mode; @deepseek-ai/dsh-sandbox-local config.runnerCommand'
  source: https://github.com/deepseek-ai/deepseek-harness/blob/master/packages/sandbox/sandbox-local/README.md
network:
  domain_allowlist: false
  config: 'none found; sandbox-policy README: network and process policy are outside its vocabulary'
  default: unrestricted egress for web_fetch/web_search/shell
  source: https://github.com/deepseek-ai/deepseek-harness/blob/master/packages/sandbox/sandbox-policy/README.md
workspace_trust:
  prompt_on_new_folder: false
  notes: No folder-trust prompt found. Executable config (plugins, MCP, sandbox/approval policy) lives
    only under $DSH_HOME, so a cloned repo cannot inject it; but AGENTS.md/CLAUDE.md and .dsh/.agents
    skills load from the repo without a prompt.
  source: https://github.com/deepseek-ai/deepseek-harness/blob/master/packages/context/agent-instructions/README.md
memory:
  persistent: false
  cross_project: false
  agent_writable: null
  notes: No built-in memory store; optional third-party memory MCP overlays (default-off) documented in
    docs/user/guide/mcp-memory.md. Sessions persist as JSONL under $DSH_HOME/sessions.
  source: https://github.com/deepseek-ai/deepseek-harness/blob/master/docs/user/guide/mcp-memory.md
subagents:
  supported: true
  inherits_permissions: delegated children pin approval policy `never` (permission-presets README); in-process
    fork/spawn and external ACP children (incl. packages subagent-claude-code and subagent-codex) exist
  notes: 'Cross-harness delegation to Claude Code / Codex is a first-party package: relevant to T11. Propagation
    of bypass flags unverified.'
  source: https://github.com/deepseek-ai/deepseek-harness/blob/master/packages/interaction/permission-presets/README.md
telemetry:
  default_on: true
  opt_out: 'DSH_TELEMETRY_MODE=DISABLED (OTel); session-log upload: `session-log-deepseek.enabled: false`
    or Settings > General > ''Upload Session Log when using the official model API'''
  training_default: unverified
  source: https://github.com/deepseek-ai/deepseek-harness/blob/master/apps/cli/reference/README.md
headless:
  command: dsh --profile headless "<task>"
  flags:
  - --profile headless
  - --session-id
  - --json
  - --patch <overlay.yml>
  ci_integrations: []
  model_override: 'profile patch: `- id: llm-pi-ai` / `config.providers.<id>: {api: openai-completions,
    baseURL: ..., apiKeyEnv: ..., models: [{id: ...}]}` in $DSH_HOME/profiles/headless/cordis.patch.yml
    (or --patch overlay); select with agent-default-model row (provider/model)'
  local_model_support: 'Yes: custom OpenAI Chat Completions / OpenAI Responses / Anthropic Messages endpoint
    via llm-pi-ai provider (Ollama http://host:11434/v1 expected to work; not tested)'
  notes: Headless profile uses launch-time credentials (credentials row disabled), no HTTP listener. Exit
    0 only for completed turn. Approval default `ask` has no answerer in headless => dangerous actions
    denied (fail closed) unless DSH_PERMISSION_MODE=danger-full-access.
security_policy:
  security_md: null
  bug_bounty: null
  advisories: https://github.com/deepseek-ai/deepseek-harness/security/advisories
  notes: 'No SECURITY.md found; SAFETY.md states: experimental, not security-audited, not production-ready;
    0 published GitHub security advisories at access time.'
extra:
  name_check: 'Product exists: github.com/deepseek-ai/deepseek-harness (MIT, created 2026-08-13; first
    npm publish 2026-08-10). Plugin framework ''Cordis'' (@deepseek-ai/cordis fork of cordiverse/cordis).
    MISSION name ''dsh'' correct.'
  npm_dist_tags:
    latest: 0.2.0-rc.2 (2026-09-29)
    alpha: 0.2.1-alpha.3 (2026-10-14)
  web_ui_auth: Web UI binds loopback :3080; launch token in printed URL exchanged for signed session cookie;
    Host-header fence; --trusted-host / --public-url / --tls-cert for exposure
  ecosystem_risk: Large third-party plugin ecosystem on npm/GitHub topic dsh-plugin (community lists claim
    11,000+ plugins; third-party-report); plugins run in-process with full privileges
