# Generated by phase1:G3 research on 2026-10-15; every fact has a source in `sources`.
id: oh-my-pi
name: Oh My Pi (omp)
vendor: Stencil Labs, Inc. (Can Bölük, can1357)
tier: A
license: MIT
open_source: true
status: analysed
version_analysed: 18.11.0
analysed_on: '2026-10-15'
homepage: https://omp.sh
repo: https://github.com/can1357/oh-my-pi
binaries:
- omp
packages:
- ecosystem: npm
  name: '@oh-my-pi/pi-coding-agent'
install_methods:
- method: curl-installer
  command: curl -fsSL https://omp.sh/install | sh
  checksum_verified: true
  signed: null
  source: https://github.com/can1357/oh-my-pi/blob/main/README.md
  note: 'README: prebuilt binary from build.stencil.so is SHA-256 checked before install; --ref pins a
    release'
- method: bun
  command: bun install -g @oh-my-pi/pi-coding-agent
  source: https://github.com/can1357/oh-my-pi/blob/main/README.md
- method: homebrew
  command: brew install can1357/tap/omp
  source: https://github.com/can1357/oh-my-pi/blob/main/README.md
- method: nix
  command: nix run github:can1357/oh-my-pi
  source: https://github.com/can1357/oh-my-pi/blob/main/README.md
auto_update:
  default: null
  config: '`omp update` subcommand exists; auto-update default not determined (unverified)'
  source: https://github.com/can1357/oh-my-pi/blob/main/docs/cli-reference.md
state_dirs:
- ~/.omp
- ~/.omp/agent
- ~/.omp/profiles/<name>/agent
- $PI_CONFIG_DIR
- $PI_CODING_AGENT_DIR
credential_files:
- ~/.omp/agent/agent.db
- ~/.omp/state/
- ~/.omp/install-id
credential_storage: SQLite (agent.db) holds stored OAuth/API credentials and legacy settings; env vars
  and models.yml apiKey also supported; install-id file is 0600. File permissions of agent.db not verified.
  Optional secret obfuscation (secrets.enabled, default off).
log_paths:
- ~/.omp/agent/sessions/<encoded-cwd>/*.jsonl
- ~/.omp/logs/omp.*.log
- ~/.omp/agent/history.db
memory_paths:
- ~/.omp/agent/memories/**
- memory://root (virtual)
config_files:
- path: ~/.omp/agent/config.yml
  scope: user
  format: yaml
  kind: settings
- path: .omp/settings.json
  scope: project
  format: json
  kind: settings
  note: also .omp/config.yml; also read from .claude/.codex/.gemini; no trust gate
- path: .omp/config.yml
  scope: project
  format: yaml
  kind: settings
- path: ~/.omp/agent/mcp.json
  scope: user
  format: json
  kind: mcp
- path: .omp/mcp.json
  scope: project
  format: json
  kind: mcp
- path: .mcp.json
  scope: project
  format: json
  kind: mcp
- path: mcp.json
  scope: project
  format: json
  kind: mcp
- path: ~/.omp/agent/models.yml
  scope: user
  format: yaml
  kind: settings
- path: ~/.omp/agent/AGENTS.md
  scope: user
  format: markdown
  kind: instructions
- path: .omp/AGENTS.md
  scope: project
  format: markdown
  kind: instructions
- path: .omp/hooks/pre/*.ts
  scope: project
  format: markdown
  kind: hooks
  note: TS hook factories loaded as in-process extensions
- path: .omp/extensions/
  scope: project
  format: markdown
  kind: hooks
- path: .omp/skills/
  scope: project
  format: markdown
  kind: skills
- path: ~/.omp/agent/secrets.yml
  scope: user
  format: yaml
  kind: settings
- path: .claude/
  scope: project
  format: json
  kind: settings
  note: Claude Code project config (settings, MCP, skills, commands, hooks) is imported
- path: .cursor/mcp.json
  scope: project
  format: json
  kind: mcp
  note: imported
- path: .vscode/mcp.json
  scope: project
  format: json
  kind: mcp
  note: imported; key mcp.servers
- path: opencode.json
  scope: project
  format: jsonc
  kind: mcp
  note: imported; key mcp
instruction_files:
- AGENTS.md
- CLAUDE.md
- GEMINI.md
- .omp/AGENTS.md
- .omp/RULES.md
- .omp/SYSTEM.md
skills_paths:
- .omp/skills
- .claude/skills
- .codex/skills
- .gemini/skills
- ~/.omp/agent/skills
mcp:
  files:
  - ~/.omp/agent/mcp.json
  - .omp/mcp.json
  - .mcp.json
  - mcp.json
  - .claude/.mcp.json
  - .cursor/mcp.json
  - .vscode/mcp.json
  - opencode.json
  - .codex/config.toml
  - .gemini/settings.json
  - .windsurf/mcp_config.json
  servers_key: mcpServers
  server_fields:
    command: command
    args: args
    env: env
    url: url
    headers: headers
    type: type
    enabled: enabled
  project_servers_require_approval: false
  notes: 'Discovers and imports MCP servers from OMP, Claude Code, Codex, Gemini, OpenCode, Cursor, Windsurf,
    VS Code project files with no folder-trust step (source: isProjectTrusted() always true). User denylist/allowlist
    keys `disabledServers` / `enabledServers` in the active-profile user mcp.json. MCP tools declare approval
    tier `write` regardless of MCP annotations.'
permissions:
  config_keys:
    mode: tools.approvalMode (config.yml)
    per_tool: tools.approval.<toolName> (allow | deny | prompt)
    bash_patterns: bash.patterns (allow/prompt/deny rules), bash.allowCompoundCommands
  default_mode: yolo (auto-approves read, write AND exec tiers; no prompts) -- docs table marks `yolo
    (default)`; source tools/approval.ts falls back to yolo
  auto_approve_values:
  - key: tools.approvalMode
    value: yolo
  cli_flags_auto_approve:
  - --yolo
  - --auto-approve
  - --approval-mode yolo
  allow_rule_syntax: 'tools.approval.bash: prompt ; bash.patterns entries with deny|prompt|allow'
  overbroad_patterns:
  - 'tools.approvalMode: yolo'
  - 'tools.approval.<tool>: allow'
  notes: 'Other modes: always-ask (auto-approve read only) and write (read+write). Critical destructive
    bash patterns (rm -rf /, fork bombs, curl|sh...) force a prompt only outside yolo (bare override ignored
    in yolo). `eval` tool is exec tier and bypasses bash.patterns deny.'
hooks:
  supported: true
  config_key: extensions / hooks directories (TypeScript factories, `pi.on('tool_call', ...)`); --hook
    flag is alias of --extension
  repo_scoped_allowed: true
  command_field: null
  notes: Project .omp/hooks/pre/*.ts and .omp/extensions run unconditionally (no trust). --trusted-extension
    <abs-file> allowlist disables ambient discovery.
sandbox:
  available: false
  default_on: false
  mechanism: none built in for shell; bash.patterns/approval are not containment (docs). Dockerfile and
    nix module exist for hosting omp.
  config: null
  source: https://github.com/can1357/oh-my-pi/blob/main/docs/approval-mode.md
network:
  domain_allowlist: false
  config: null
  default: unrestricted
  source: https://github.com/can1357/oh-my-pi/blob/main/docs/approval-mode.md
workspace_trust:
  prompt_on_new_folder: false
  notes: 'OMP performs no project-trust gating: project-level settings and extensions load unconditionally
    (source comment in extensions/types.ts isProjectTrusted()). Differs from upstream Pi >= 0.79.'
  source: https://github.com/can1357/oh-my-pi/blob/main/packages/coding-agent/src/extensibility/extensions/types.ts
memory:
  persistent: true
  cross_project: true
  agent_writable: true
  notes: 'memory.backend: off (default) | local | hindsight (remote) | mnemopi | sharpshooter. local =
    project-scoped summaries/lessons from sessions injected into system prompt; agent can write via `learn`;
    readable via memory:// URLs.'
  source: https://github.com/can1357/oh-my-pi/blob/main/docs/memory.md
subagents:
  supported: true
  inherits_permissions: null
  notes: Task/subagent tool with per-agent model overrides; permission inheritance not verified.
  source: https://github.com/can1357/oh-my-pi/blob/main/docs/settings.md
telemetry:
  default_on: null
  opt_out: 'telemetry.otlpExportEnabled: false; OTEL_SDK_DISABLED=true (OTLP only initialises when an
    endpoint is set)'
  training_default: n/a
  source: https://github.com/can1357/oh-my-pi/blob/main/docs/environment-variables.md
  notes: A persistent install-id UUID (~/.omp/install-id) is sent to some providers/gateways as identity
    metadata (Codex installationId, Claude-compatible device_id, auth-broker usage attribution with hostname).
headless:
  command: omp -p "<prompt>"
  flags:
  - -p/--print
  - --mode json|rpc|acp|rpc-ui
  - --print-thoughts
  - --no-session
  - --approval-mode always-ask|write|yolo
  - --model <id>
  - --profile <name>
  - --trusted-extension <abs>
  ci_integrations: []
  model_override: --model; custom providers in ~/.omp/agent/models.yml (providers.<id>.baseUrl/api/apiKey/discovery.type)
  local_model_support: 'Yes: implicit keyless Ollama discovery (OLLAMA_BASE_URL / OLLAMA_HOST / http://127.0.0.1:11434)
    and lm-studio/llama.cpp; or models.yml provider {baseUrl, api: openai-completions}'
security_policy:
  security_md: https://github.com/can1357/oh-my-pi/blob/main/.github/SECURITY.md
  bug_bounty: null
  advisories: https://github.com/can1357/oh-my-pi/security/advisories
  notes: Only latest release supported; best-effort response; 0 published advisories at access time.
extra:
  relationship_to_pi: Fork of badlogic/pi-mono (now earendil-works/pi) by Stencil Labs; version scheme
    diverged (18.x vs Pi 1.x); shim for Pi extensions.
  cross_tool_import: Reads .claude/.codex/.gemini/.cursor/.windsurf/.vscode/opencode configs, so a repo
    prepared for ANOTHER harness can configure omp (hooks, MCP, skills).
