# Generated by phase1:G3 research on 2026-10-15; every fact has a source in `sources`.
id: openclaw
name: OpenClaw (formerly Clawdbot, Moltbot; earlier Warelay)
vendor: OpenClaw project
tier: A
license: MIT
open_source: true
status: analysed
version_analysed: 2026.10.3
analysed_on: '2026-10-15'
homepage: https://openclaw.ai
repo: https://github.com/openclaw/openclaw
binaries:
- openclaw
packages:
- ecosystem: npm
  name: openclaw
- ecosystem: npm
  name: clawdbot
  note: legacy name; GHSAs for <= 2026.1.28 list package `clawdbot`
install_methods:
- method: curl-installer
  command: curl -fsSL https://openclaw.ai/install.sh | bash
  checksum_verified: null
  signed: null
  source: https://github.com/openclaw/openclaw/blob/main/README.md
- method: powershell
  command: iwr -useb https://openclaw.ai/install.ps1 | iex
  source: https://github.com/openclaw/openclaw/blob/main/README.md
- method: npm
  command: npm install -g openclaw@latest --allow-scripts=openclaw
  source: https://github.com/openclaw/openclaw/blob/main/README.md
  note: npm 12 / 11.16+; Node 24.16+ or 26.1+
- method: docker/nix/fly
  command: Dockerfile, docker-compose.yml, fly.toml, Nix
  source: https://github.com/openclaw/openclaw/blob/main/README.md
auto_update:
  default: true
  config: daily update-check request on by default (version, OS, Node, arch); anonymous feature stats
    opt-in; see `openclaw telemetry show`
  source: https://github.com/openclaw/openclaw/blob/main/docs/gateway/telemetry.md
state_dirs:
- ~/.openclaw
- $OPENCLAW_STATE_DIR
- ~/.openclaw/workspace
- ~/.openclaw/agents/<agentId>/agent
- ~/.openclaw/state
credential_files:
- ~/.openclaw/.env
- ~/.openclaw/state/openclaw.sqlite
- ~/.openclaw/agents/<agentId>/agent/openclaw-agent.sqlite
- ~/.openclaw/openclaw.json (gateway.auth.token, channel tokens if plaintext)
credential_storage: Shared SQLite store (~/.openclaw/state/openclaw.sqlite) plus agent-local SQLite; legacy
  auth-profiles.json imported by doctor; SecretRefs (env/file/exec/store) avoid plaintext in config; docs
  state plaintext credentials remain agent-readable; recommended perms 700 dirs / 600 files; Claude CLI
  login can be reused. No OS keychain documented.
log_paths:
- ~/.openclaw/logs/**
- ~/.openclaw/agents/*/sessions/**
- ~/.openclaw/state/openclaw.sqlite (audit ledger)
memory_paths:
- ~/.openclaw/workspace/MEMORY.md
- ~/.openclaw/workspace/USER.md
- ~/.openclaw/workspace/memory/*.md
- ~/.openclaw/workspace/SOUL.md
- ~/.openclaw/workspace/AGENTS.md
config_files:
- path: ~/.openclaw/openclaw.json
  scope: user
  format: jsonc
  kind: settings
  note: JSON5; also OPENCLAW_CONFIG_PATH override (name unverified); $include supported
- path: ~/.openclaw/.env
  scope: user
  format: env
  kind: settings
- path: ~/.openclaw/workspace/AGENTS.md
  scope: user
  format: markdown
  kind: instructions
- path: ~/.openclaw/workspace/SOUL.md
  scope: user
  format: markdown
  kind: instructions
- path: ~/.openclaw/workspace/USER.md
  scope: user
  format: markdown
  kind: instructions
- path: ~/.openclaw/workspace/MEMORY.md
  scope: user
  format: markdown
  kind: instructions
- path: ~/.openclaw/exec-approvals (host approvals document; path unverified)
  scope: user
  format: json
  kind: settings
- path: ~/.openclaw/workspace/skills/
  scope: user
  format: markdown
  kind: skills
  note: path unverified; skills also installed from ClawHub
instruction_files:
- AGENTS.md
- SOUL.md
- USER.md
- MEMORY.md
- TOOLS.md?
skills_paths:
- ~/.openclaw/workspace/skills (unverified)
- ClawHub installs via `openclaw skills install`
mcp:
  files:
  - ~/.openclaw/openclaw.json
  servers_key: mcp.servers
  server_fields:
    url: url
    command: command   # stdio
    args: args
    env: env
    headers: headers
    type: transport   # streamable-http | sse | stdio
    enabled: enabled
    filter: toolFilter.include/exclude
    timeouts: connectionTimeoutMs, requestTimeoutMs
  project_servers_require_approval: null
  notes: MCP is gateway-global config (no repo-level MCP file). `openclaw mcp set/unset/list/doctor/probe/login`;
    per-server `--approval approve|prompt|auto`; 'Allow Always' durable grants per exact server+tool.
    OpenClaw can also act as an MCP server (`openclaw mcp serve`) exposing channel conversations.
permissions:
  config_keys:
    exec_mode: tools.exec.mode / tools.exec.security (deny | allowlist | full) / tools.exec.ask (off |
      on-miss | always)
    session_mode: per-session permission mode read-only | guarded | workspace | full (full requires operator.admin)
    tool_policy: tools.profile, tools.allow/tools.deny (groups like group:runtime, group:fs), tools.fs.workspaceOnly,
      tools.elevated.enabled
    sandbox: agents.defaults.sandbox (off by default)
  default_mode: host exec security=full, ask=off on gateway/node hosts (no approval prompts); sandbox
    off; docs' hardened baseline sets exec security=deny ask=always
  auto_approve_values:
  - key: tools.exec.security
    value: full
  - key: tools.exec.ask
    value: 'off'
  - key: tools.exec.mode
    value: full
  - key: tools.elevated.enabled
    value: 'true'
  - key: gateway.auth.mode
    value: none (explicit no-auth)
  - key: channels.<ch>.dmPolicy
    value: open (anyone can DM the agent)
  cli_flags_auto_approve: []
  allow_rule_syntax: exec approvals allowlist entries (per-agent, resolved executable path / argv patterns)
  overbroad_patterns:
  - 'tools.exec.security: full + ask: off'
  - 'dmPolicy: open'
  - 'allowFrom: ["*"]'
  - 'gateway.bind: lan with auth.mode none'
  - 'gateway.auth.mode: none'
  notes: 'Docs'' hardened baseline: gateway.bind loopback, auth token, dmPolicy pairing, tools.profile
    messaging, exec security deny/ask always, tools.fs.workspaceOnly, sandbox on. `openclaw security audit
    [--deep]` checks config.'
hooks:
  supported: true
  config_key: hooks.* (HTTP webhook ingress) and hooks.internal (HOOK.md internal hooks); plugin tool_call
    hooks
  repo_scoped_allowed: false
  command_field: null
  notes: Webhook ingress requires token; hook session-key override was GHSA-hv93-r4j3-q65f.
sandbox:
  available: true
  default_on: false
  mechanism: Docker (default local backend), Podman, SSH, OpenShell, Crabbox cloud boxes; Gateway process
    itself always stays on host
  config: agents.defaults.sandbox.* / agents.entries.*.sandbox
  source: https://github.com/openclaw/openclaw/blob/main/docs/gateway/sandboxing.md
network:
  domain_allowlist: true
  config: secret egress proxy with traffic allowlist (default-off); gateway/security/network-proxy.md;
    SSRF guards in web fetch
  default: unrestricted for agent tools
  source: https://github.com/openclaw/openclaw/blob/main/docs/gateway/secrets.md
workspace_trust:
  prompt_on_new_folder: false
  notes: 'Not repo-centric: config lives in ~/.openclaw and the agent workspace; trust boundary is gateway
    authentication + operator scopes + channel DM pairing/allowlists. CWD .env injection (GHSA-8rh7-6779-cjqq,
    critical) shows cwd content influenced config.'
  source: https://github.com/openclaw/openclaw/blob/main/docs/gateway/security/trust-model.md
memory:
  persistent: true
  cross_project: true
  agent_writable: true
  notes: Workspace MEMORY.md, USER.md, daily memory/*.md, SOUL.md; active memory, 'dreaming' consolidation,
    Honcho backend; provenance records for USER/MEMORY content; memory-flush runs expose only read and
    append-only write.
  source: https://github.com/openclaw/openclaw/blob/main/docs/concepts/memory.md
subagents:
  supported: true
  inherits_permissions: per-agent sandbox/tool policy; heartbeat/inheritance paths had sandbox-bypass
    advisory (GHSA-g5cg-8x5w-7jpm)
  notes: Multi-agent, ACP agents (Codex/Claude harness plugins), swarm, sessions_spawn.
  source: https://github.com/openclaw/openclaw/blob/main/docs/tools/subagents.md
telemetry:
  default_on: true
  opt_out: daily update-check request on by default; disable all automatic update-check requests per docs
    (`openclaw telemetry` / config; exact key unverified); anonymous feature statistics off by default;
    OPENCLAW_TELEMETRY_ENDPOINT for self-hosting
  training_default: n/a (provider-dependent)
  source: https://github.com/openclaw/openclaw/blob/main/docs/gateway/telemetry.md
headless:
  command: openclaw agent exec "<task>" [--json] [--message-file F] [--cwd DIR]
  flags:
  - --json
  - --message-file
  - --cwd
  - --model
  - --fallback
  - --state-dir
  - --config <path>
  - --auth-env-only
  - --code-mode direct|auto|code
  - --local-model-lean
  ci_integrations: []
  model_override: --model provider/model (e.g. ollama/qwen3.5:9b); agents.defaults.model.primary; models.providers.<id>
    {baseUrl, api}
  local_model_support: 'Yes: native Ollama provider (use baseUrl http://host:11434 WITHOUT /v1 -- docs
    say the /v1 OpenAI-compatible URL breaks tool calling); LM Studio, llama.cpp, vLLM/SGLang/LiteLLM
    via `api: openai-completions|openai-responses` + baseUrl'
  notes: '`agent exec` runs an embedded turn with temporary state dir (deleted after), no Gateway; uses
    ordinary config and stored credentials unless --auth-env-only / --config pinned.'
security_policy:
  security_md: https://github.com/openclaw/openclaw/blob/main/SECURITY.md
  bug_bounty: null
  advisories: https://github.com/openclaw/openclaw/security/advisories
  notes: 'Private GHSA or security@openclaw.ai; trust page https://trust.openclaw.ai; no paid bounty;
    model: single trusted operator per gateway; prompt-injection-only chains out of scope. 722 published
    repo advisories at access time.'
extra:
  name_history: 'Warelay -> Clawdbot -> Moltbot -> OpenClaw (VISION.md); January 2026 rename after a trademark
    request (docs/start/lore.md). Repo openclaw/openclaw created 2025-11-24. MISSION ''community, MIT
    (verify)'': license verified MIT; maintained by a multi-org maintainer group (SECURITY.md mentions
    NVIDIA, Tencent engineers).'
  gateway: WebSocket+HTTP control plane default 127.0.0.1:18789; auth required by default (token generated
    at onboarding); modes none|token|password|trusted-proxy; Control UI served from the gateway
  cve_volume: 722 published GHSAs (14 critical, 249 high, 390 medium, 69 low); 39 with CVE ids (at access
    time)
