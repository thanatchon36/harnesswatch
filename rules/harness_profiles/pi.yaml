# Generated by phase1:G3 research on 2026-10-15; every fact has a source in `sources`.
id: pi
name: Pi coding agent
vendor: Earendil Works (Mario Zechner)
tier: A
license: MIT
open_source: true
status: analysed
version_analysed: 1.2.0
analysed_on: '2026-10-15'
homepage: https://pi.dev
repo: https://github.com/earendil-works/pi
binaries:
- pi
packages:
- ecosystem: npm
  name: '@earendil-works/pi-coding-agent'
- ecosystem: npm
  name: '@mariozechner/pi-coding-agent'
  note: old scope, affected by 2026 CVEs <= 0.73.1
install_methods:
- method: curl-installer
  command: curl -fsSL https://pi.dev/install.sh | sh
  checksum_verified: null
  signed: null
  source: https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/quickstart.md
  note: 'docs: installer pins all dependencies; updates with `pi update`'
- method: npm
  command: npm install -g --ignore-scripts @earendil-works/pi-coding-agent
  source: https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/quickstart.md
  note: transitive deps not pinned
- method: nix
  command: nix profile add github:earendil-works/pi
  source: https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/quickstart.md
auto_update:
  default: null
  config: PI_SKIP_VERSION_CHECK disables the pi.dev latest-version request; PI_OFFLINE disables automatic
    network activity; updates are explicit via `pi update`
  source: https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/environment-variables.md
state_dirs:
- ~/.pi/agent
- $PI_CODING_AGENT_DIR
credential_files:
- ~/.pi/agent/auth.json
credential_storage: Plaintext JSON (API keys + OAuth tokens) in auth.json, written mode 0600 in a 0700
  dir; models.json apiKey may be literal, $ENV, or `!command`. No OS keychain.
log_paths:
- ~/.pi/agent/sessions/**/*.jsonl
- $PI_CODING_AGENT_SESSION_DIR
memory_paths: []
config_files:
- path: ~/.pi/agent/settings.json
  scope: user
  format: json
  kind: settings
- path: .pi/settings.json
  scope: project
  format: json
  kind: settings
  note: requires project trust
- path: ~/.pi/agent/mcp.json
  scope: user
  format: json
  kind: mcp
- path: .pi/mcp.json
  scope: project
  format: json
  kind: mcp
  note: requires project trust
- path: ~/.pi/agent/models.json
  scope: user
  format: json
  kind: settings
- path: ~/.pi/agent/auth.json
  scope: user
  format: json
  kind: settings
- path: ~/.pi/agent/trust.json
  scope: user
  format: json
  kind: settings
- path: ~/.pi/agent/extensions/
  scope: user
  format: markdown
  kind: hooks
  note: TypeScript extensions run in-process
- path: .pi/extensions/
  scope: project
  format: markdown
  kind: hooks
  note: requires project trust
- path: ~/.pi/agent/skills/
  scope: user
  format: markdown
  kind: skills
- path: .pi/skills/
  scope: project
  format: markdown
  kind: skills
  note: requires project trust
- path: .agents/skills/
  scope: project
  format: markdown
  kind: skills
  note: requires project trust (cwd or ancestor)
- path: .pi/SYSTEM.md
  scope: project
  format: markdown
  kind: instructions
  note: requires project trust
- path: .pi/APPEND_SYSTEM.md
  scope: project
  format: markdown
  kind: instructions
  note: requires project trust
instruction_files:
- AGENTS.override.md
- AGENTS.md
- AGENTS.MD
- CLAUDE.md
- CLAUDE.MD
skills_paths:
- .pi/skills
- .agents/skills
- ~/.pi/agent/skills
mcp:
  files:
  - ~/.pi/agent/mcp.json
  - .pi/mcp.json
  servers_key: mcpServers
  server_fields:
    command: command
    args: args
    env: env
    url: url
    headers: headers
    type: type
    enabled: enabled
    exposure: exposure
    description: description
  project_servers_require_approval: true
  notes: Project .pi/mcp.json is read only after project trust is granted; a project entry replaces a
    same-named user entry. ${VAR} interpolation in env/headers. `pi mcp add [-l] ...` CLI.
permissions:
  config_keys:
    default_tools: 'settings.json: defaultTools'
    project_trust_default: 'settings.json: defaultProjectTrust (ask | always | never)'
  default_mode: 'no approval prompts: default tools read, bash, edit, write run without asking (docs:
    ''does not ask for approval before every tool call'')'
  auto_approve_values:
  - key: defaultProjectTrust
    value: always
    note: loads protected project resources in print/json/rpc modes and without prompt
  cli_flags_auto_approve:
  - --approve (project trust yes, one-time)
  allow_rule_syntax: null
  overbroad_patterns:
  - 'defaultProjectTrust: always'
  notes: 'Pi has NO command-permission system by design (SECURITY.md/docs/security.md: run it in a container/VM).
    Tool restriction only via --tools / --no-tools / --exclude-tools / defaultTools.'
hooks:
  supported: true
  config_key: extensions (TypeScript modules registering event handlers e.g. tool_call, project_trust)
  repo_scoped_allowed: true
  command_field: null
  notes: Project extensions in .pi/extensions load only after project trust (since 0.79.0; CVE-2026-54325
    fixed it). Extensions execute in-process with full user privileges.
sandbox:
  available: false
  default_on: false
  mechanism: none built in; docs recommend running Pi inside container/VM (docs/containerization.md)
  config: null
  source: https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/security.md
network:
  domain_allowlist: false
  config: PI_OFFLINE disables Pi's own automatic network activity only
  default: unrestricted
  source: https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/environment-variables.md
workspace_trust:
  prompt_on_new_folder: true
  notes: 'Project trust gates .pi/settings.json, .pi/mcp.json, .pi/extensions|skills|prompts|themes, .pi/SYSTEM.md|APPEND_SYSTEM.md,
    .agents/skills. Context files (AGENTS.md, CLAUDE.md) load regardless of trust. Saved in ~/.pi/agent/trust.json.
    Non-interactive modes: defaultProjectTrust ''ask'' or ''never'' skip protected resources; ''always''
    loads them. sessionDir is read before trust.'
  source: https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/security.md
memory:
  persistent: false
  cross_project: false
  agent_writable: null
  notes: No built-in memory feature documented (sessions only; AGENTS.md is user-authored). Extensions
    may add one.
  source: https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/index.md
subagents:
  supported: false
  inherits_permissions: null
  notes: No built-in subagents documented (minimal harness); extensions/packages can add them (unverified).
  source: https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/index.md
telemetry:
  default_on: true
  opt_out: PI_TELEMETRY=0 or settings enableInstallTelemetry=false (install/update ping + provider attribution
    headers); PI_SKIP_VERSION_CHECK=1; PI_OFFLINE=1
  training_default: n/a (depends on model provider)
  source: https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/settings.md
headless:
  command: pi --print "<prompt>"
  flags:
  - -p/--print
  - --mode json
  - --mode rpc
  - --no-session
  - --tools read,grep,find,ls
  - --approve / --no-approve
  - --no-extensions
  - --no-mcp
  - --no-context-files
  - --offline
  ci_integrations: []
  model_override: --model <pattern> / --provider <name> / --api-key; custom endpoint in ~/.pi/agent/models.json
  local_model_support: 'Yes: models.json provider {baseUrl: http://localhost:11434/v1, api: openai-completions,
    apiKey: ollama, models: [{id: <model>}]} (documented for Ollama, LM Studio, vLLM, llama.cpp)'
security_policy:
  security_md: https://github.com/earendil-works/pi/blob/main/SECURITY.md
  bug_bounty: null
  advisories: https://github.com/earendil-works/pi/security/advisories
extra:
  repo_history: badlogic/pi-mono redirects to earendil-works/pi; npm scope moved @mariozechner/pi-coding-agent
    -> @earendil-works/pi-coding-agent (advisories list both). Verified via GitHub advisory API.
  trust_model: 'SECURITY.md: Pi runs inside the user''s security boundary; prompt injection via AGENTS.md
    etc. ''cannot be protected against''; extension/skill installs are user responsibility.'
