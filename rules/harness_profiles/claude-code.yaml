extra:
  user_settings_keys_seen_locally: [permissions, statusLine, enabledPlugins, extraKnownMarketplaces, skipDangerousModePermissionPrompt, theme]
  claude_json_top_level_keys_seen_locally: [installMethod, autoUpdates, projects, oauthAccount, userID, machineID]   # key names only; oauthAccount/userID are identifiers
  settings_env_block_ignored_in_project: "CLAUDE_CONFIG_DIR and OTel exporter variables are ignored in project/local `env`"
  local_state_modes_2026_10_15: "~/.claude 0755; transcripts projects/*/*.jsonl 0600; history.jsonl 0600; ~/.claude.json 0600; projects/*/memory/* 0644; sessions/ 0700 (names/modes only; ledger B1-012)"
  subprocess_env_scrub: "CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1 strips credentials from Bash/hook/stdio-MCP subprocess env; off by default"
  npm_package_2_1_300: "postinstall `node install.cjs`; dependencies {}; 8 platform optionalDependencies; 7 files / 189,328 B; trusted publisher GitHub Actions OIDC; no provenance attestation; dist-tag stable=2.1.292"
  leaked_source_map_event: "2.1.88 npm package shipped a source map (2026-03-31); cited as an event only, source not used"
