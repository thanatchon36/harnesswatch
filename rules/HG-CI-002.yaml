id: HG-CI-002
title: Agent CI job runs with a write-scoped GITHUB_TOKEN
area: CI
severity: medium
confidence: medium
kind: design-weakness
taxonomy: [T09, T14]
description: >
  A job that runs a coding agent and has write-scoped (or default) GITHUB_TOKEN permissions lets a
  steered agent push commits, edit workflows, comment or publish packages. Least privilege bounds the
  blast radius of a successful injection.
remediation: >
  Add an explicit `permissions:` block with read-only scopes for agent jobs, granting only the single
  write scope the job needs (e.g. `pull-requests: write` to comment).
references:
  - https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
