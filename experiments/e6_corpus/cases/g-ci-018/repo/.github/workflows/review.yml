name: agent
'on':
  issues:
    types:
    - opened
jobs:
  agent:
    runs-on: ubuntu-latest
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.issue.author_association)
    steps:
    - uses: actions/checkout@v5
    - name: Claude headless
      run: 'claude -p "Triage this issue: ${{ github.event.issue.title }} ${{ github.event.issue.body }}" --dangerously-skip-permissions'
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
