stages: [review]
claude-review:
  stage: review
  image: node:22
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    ANTHROPIC_API_KEY: $ANTHROPIC_API_KEY
  script:
    - npm i -g @anthropic-ai/claude-code@2.1.300
    - claude -p "Review the MR diff and comment" --dangerously-skip-permissions
