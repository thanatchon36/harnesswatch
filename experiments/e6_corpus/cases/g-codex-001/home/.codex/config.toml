model = "gpt-5.1-codex"
model_reasoning_effort = "low"
approval_policy = "untrusted"
sandbox_mode = "read-only"
approvals_reviewer = "auto_review"

[features]
memories = true

[otel]
environment = "dev"
log_user_prompt = false

[mcp_servers.git]
command = "uvx"
args = ["mcp-server-git", "--repository", "."]

[mcp_servers.git.env]
LOG_LEVEL = "info"
ALLOWED_DIRECTORIES = "/workspace/app"
