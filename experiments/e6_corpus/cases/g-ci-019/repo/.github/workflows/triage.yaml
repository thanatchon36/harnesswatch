name: agent
'on':
  issues:
    types:
    - opened
permissions:
  contents: write
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Claude headless
      run: 'claude -p "Triage this issue: ${{ github.event.issue.title }} ${{ github.event.issue.body }}" --allowedTools ''Read,Grep'''
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
