name: ci
'on':
  push:
    branches:
    - main
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - run: npm ci && npm test
    - run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
