name: agent
'on':
  push:
    branches:
    - main
jobs:
  agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
    - uses: anthropics/claude-code-action@v1
      with:
        prompt: Review this change and suggest fixes.
        claude_args: --allowedTools "Bash(npm test),Read"
