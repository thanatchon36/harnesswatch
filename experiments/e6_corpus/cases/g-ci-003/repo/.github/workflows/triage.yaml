name: agent
'on':
  schedule:
  - cron: 0 6 * * 1
jobs:
  agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
    - name: Claude headless
      run: claude -p "Review this change and suggest fixes." --allowedTools 'Read,Grep'
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
