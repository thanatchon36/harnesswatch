name: agent
'on':
  issue_comment:
    types:
    - created
jobs:
  agent:
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
    - uses: actions/checkout@v5
    - name: Codex review
      run: 'npm i -g @openai/codex@0.58.0

        codex exec "Triage this issue: ${{ github.event.issue.title }} ${{ github.event.issue.body }}"'
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
