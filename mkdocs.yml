site_name: harnesswatch
site_description: Security audit toolkit for AI coding-agent harnesses
site_url: https://thanatchon36.github.io/harnesswatch/
repo_url: https://github.com/thanatchon36/harnesswatch
repo_name: thanatchon36/harnesswatch
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features: [navigation.sections, content.code.copy]
strict: true
nav:
  - Home: index.md
  - Paper: paper/index.html
  - Quickstart: quickstart.md
  - CLI reference: cli.md
  - Rule reference: reference/rules.md
  - Harness profiles: reference/profiles.md
  - Observe (black-box probe): observe.md
  - Bench methodology: bench.md
  - Threat taxonomy: taxonomy.md
  - Security of the tool: security.md
exclude_docs: |
  reference/bench-scenarios.md
markdown_extensions:
  - admonition
  - tables
  - pymdownx.snippets:
      base_path: docs
