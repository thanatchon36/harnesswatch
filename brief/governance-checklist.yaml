- id: GC-07
  lifecycle: configuration-baseline
  title: Narrow tool allowlists and deny rules
  statement: Tool allowlists shall name specific commands with fixed arguments; whole-tool or wildcard
    entries for shells, interpreters, network tools, package managers or git with arbitrary arguments
    shall not be allowed without a prompt. Where any auto-approval is in force, deny rules shall cover
    recursive deletion, history-rewriting pushes and reads of credential files.
  addresses:
  - design-weakness
  rationale: An allowlist entry such as Bash(*) or Bash(git *) is equivalent to auto-approve for that
    tool (git subcommands can run arbitrary programs). Deny rules are the last guard when auto-approval
    is on, but they are bypassable and do not replace a sandbox.
