- id: GC-04
  lifecycle: before-adoption
  title: Pre-adoption prompt-injection resilience test with inert canaries
  statement: Before approval, and when the harness, model or permission mode changes materially, the organisation
    shall test the harness in its intended permission mode against indirect prompt injection placed in
    repository content and tool output, using inert canaries in a disposable environment, and shall record
    the result with its confidence interval and number of runs.
  addresses:
  - design-weakness
  rationale: Instruction-following on attacker-written text is a property of the model and harness together,
    not a defect that a patch removes. A measured baseline shows how much the permission mode and egress
    controls have to carry. Results apply only to the tested harness, model, mode and version.
  threats:
  - T01
  - T08
  root_causes:
  - RC1
  - RC9
  dimensions:
  - D01
  - D03
  verify:
    commands:
    - harnesswatch bench list
    - harnesswatch bench run --out bench-results/<date> --harness <adapter-id> --mode default --mode auto
      -n 5
    - harnesswatch bench report bench-results/<date>
    rules: []
    manual: Review summary.json for per-cell canary rates with Wilson 95% confidence intervals; do not
      report cells with fewer than 3 runs. Harnesses without a bench adapter need one written or a manual
      test with the same scenarios.
  mappings:
    nist_ai_rmf:
