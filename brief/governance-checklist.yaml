- id: GC-17
  lifecycle: configuration-baseline
  title: Network egress allowlist
  statement: Network access from agent tools shall be off by default and limited to an allowlist of approved
    destinations (package registries, internal documentation, approved model and MCP endpoints), enforced
    through the harness's domain allowlist or an egress proxy. Automatic rendering or fetching of remote
    content (e.g. markdown images) shall be disabled where configurable.
  addresses:
  - design-weakness
  rationale: Network reach is the exfiltration channel for any successful injection; rendering and auto-fetch
    features can carry data out without an explicit tool call (RC9).
