- id: GC-05
  lifecycle: before-adoption
  title: Telemetry, data residency and retention as a documented policy decision
  statement: For each approved harness and model endpoint, the organisation shall decide and document
    which data classes may be sent to which vendor or endpoint, where it is processed and stored, how
    long it is retained, and whether usage telemetry, prompt logging and vendor data sharing are enabled.
    The decision shall be enforced through managed settings or network controls where the harness supports
    it.
  addresses:
  - policy-choice
  rationale: Telemetry and vendor-side retention are policy choices of the vendor, not vulnerabilities.
    Whether they are acceptable depends on the organisation's data classification, outsourcing and residency
    obligations, so the organisation has to make the choice explicitly and check that configuration matches
    it.
  threats:
  - T15
  root_causes:
  - RC7
  dimensions:
  - D12
  - D14
  verify:
    commands:
    - harnesswatch audit config . -f json -o config.json
    rules:
    - HG-TEL-001
    manual: 'Review the vendor''s data-use, retention and region terms against the data-classification
      policy. HG-TEL-001 is informational: it reports telemetry or prompt logging explicitly enabled in
      configuration, not whether the organisation''s decision is met.'
  mappings:
    nist_ai_rmf:
    - MEASURE 2.10
    - MEASURE 2.8
    - GOVERN 1.1
    - MANAGE 4.3
    nist_ai_600_1:
      risks:
