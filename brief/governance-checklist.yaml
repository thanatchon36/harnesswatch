- id: GC-09
  lifecycle: configuration-baseline
  title: No auto-approval of repository-declared MCP servers
  statement: MCP servers declared in a repository file shall not be started or have their tools called
    without per-server approval. Settings that enable all project MCP servers, mark servers as trusted
    or auto-approve their tools shall not be used; where the harness supports a managed MCP allowlist,
    only servers on the organisation's approved list shall be permitted.
  addresses:
  - design-weakness
  rationale: A committed MCP declaration asks every cloner's harness to start a local process. Combined
    with an enable-all or trust setting in the same repository, cloning and opening the repository runs
    attacker-chosen commands (the CurXecute / MCPoison class).
