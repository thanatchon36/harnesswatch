- id: GC-03
  lifecycle: before-adoption
  title: Verify vendor claims against observed behaviour (closed-source harnesses)
  statement: For any closed-source harness, the organisation shall verify, before approval and after each
    major version, that the vendor's documented network destinations, configuration-trust behaviour, sandboxing
    and credential storage match what the client does when run in an isolated environment with synthetic
    data. Undocumented destinations or behaviours shall be raised with the supplier and resolved or risk-accepted
    before production use.
  addresses:
  - policy-choice
  - design-weakness
  rationale: Without source access, documentation is the only basis for the control assessment. A black-box
    observation (hosts contacted, files written and their modes, whether repository configuration executes
    before trust is granted) checks the documentation. Differences are usually documentation gaps or policy
    choices, not vulnerabilities, and should be labelled as such.
  threats:
  - T15
  - T02
  - T17
  root_causes:
  - RC7
  - RC2
  - RC8
  dimensions:
  - D12
  - D04
  - D02
  - D07
  verify:
    commands:
    - harnesswatch observe <harness-id> --image <image-with-harness> --repo <synthetic-repo> -o observe-<harness-id>.json
      -- <harness command>
    rules: []
    manual: 'Compare the hosts, file modes and pre-trust execution recorded in the observe report with
      the vendor''s documented claims, one row per claim (format of matrix/claims_vs_observed.csv: claim,
      source, observed, method, verdict). Use only synthetic credentials and data; observe records metadata
      only and does not intercept TLS.'
  mappings:
    nist_ai_rmf:
    - MEASURE 2.10
    - MEASURE 2.8
