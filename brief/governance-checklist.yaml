- id: GC-21
  lifecycle: runtime-and-ci
  title: 'Headless agents in CI: no untrusted triggers (pwn-request pattern)'
  statement: A coding agent shall not run non-interactively in CI on events that outsiders can trigger
    (issue and pull-request comments, issues, pull_request_target) unless the job is gated on author association
    or an actor allowlist. Event text shall be passed through environment variables, never interpolated
    into the prompt or script, and deployment secrets shall not be exposed to agent jobs.
  addresses:
  - design-weakness
  rationale: The agent reads attacker-written text in a job that may hold secrets and write access. With
    auto-approval or interpolation and no actor gate, a crafted issue or pull request can steer the agent
    to leak secrets or push code.
