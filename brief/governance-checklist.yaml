- id: GC-28
  lifecycle: supplier-management
  title: Verified installers and a controlled update channel
  statement: Harnesses shall be installed from a package manager with a lockfile or from vendor artefacts
    whose checksum or signature is verified, not through unverified 'curl | sh' installers. Automatic
    updates shall follow an organisation-controlled channel or version pin, so that new versions are adopted
    deliberately and can be rolled back.
  addresses:
  - design-weakness
  rationale: With on-by-default auto-update, whoever controls the download host or CDN path controls code
    that runs with the developer's credentials. Harness packages and update channels have been compromised
    (RC5).
  threats:
  - T06
  root_causes:
  - RC5
  dimensions:
  - D13
  - D14
  verify:
    commands:
    - harnesswatch audit supply -f json -o supply.json
    rules:
