- id: GC-26
  lifecycle: monitoring-and-incident-response
  title: Continuous configuration posture monitoring
  statement: The organisation shall audit harness configuration, MCP declarations, secret residue, file
    modes and installed versions on managed endpoints and build agents on a fixed schedule and after each
    harness upgrade, and track new findings against an approved baseline.
  addresses:
  - design-weakness
  - vulnerability
  rationale: 'User-level configuration drifts after onboarding: bypass modes are switched on, MCP servers
    added, transcripts accumulate. A scheduled audit with a baseline turns drift into tickets.'
  threats:
  - T03
  - T07
  - T06
  root_causes:
  - RC6
  - RC7
  - RC5
  dimensions:
