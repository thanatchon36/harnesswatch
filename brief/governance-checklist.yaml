- id: GC-30
  lifecycle: supplier-management
  title: 'Supplier terms: transparency, change notice and disclosure'
  statement: 'Contracts or terms for harness and model suppliers shall cover: data use, retention and
    processing locations; notice of material changes to the client, its data flows or default settings;
    a security contact and advisory process; incident notification; and the organisation''s right to test
    the client''s behaviour (GC-03). Gaps shall be risk-accepted by the accountable owner.'
  addresses:
  - policy-choice
