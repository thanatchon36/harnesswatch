- id: GC-25
  lifecycle: monitoring-and-incident-response
  title: Agent activity logging and audit trail
  statement: 'The organisation shall retain, in a store the agent cannot modify, a record of agent sessions
    sufficient to reconstruct what the agent did: the user or trigger, harness and version, permission
    mode, tool and MCP calls with their approval decisions, sub-agent delegation, and files changed. Logs
    shall be redacted for secrets and retained according to policy.'
