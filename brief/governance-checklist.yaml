- id: GC-10
  lifecycle: configuration-baseline
  title: MCP server pinning, provenance and change review
  statement: Every approved MCP server shall be pinned to an exact version or content digest, installed
    from an approved source or internal mirror, and re-reviewed (including its tool descriptions) before
    any version change. Launch commands that fetch the latest package at each start shall not be used.
  addresses:
  - design-weakness
  - vulnerability
  rationale: Unpinned launchers (npx -y, uvx, mutable image tags) run whatever the registry serves at
    each start, so a compromised maintainer account or malicious update runs with the agent's privileges.
    Tool descriptions are placed in the model context verbatim and can change after approval (rug pull).
