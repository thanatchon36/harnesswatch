- id: GC-08
  lifecycle: configuration-baseline
  title: Repository configuration is untrusted until reviewed (hooks, settings, env)
  statement: 'Harness configuration committed to a repository (hooks, project settings, environment blocks,
    sandbox or permission overrides) shall be treated as executable code: it shall not take effect before
    the user grants workspace trust, shall be changed only through reviewed pull requests with designated
    code owners, and shall not set model endpoints, credentials or network settings. Hooks shall be defined
    in user-level or managed settings, or restricted to managed hooks where the harness supports it.'
  addresses:
  - vulnerability
  - design-weakness
  rationale: Opening a repository is enough to run its hooks or start its configured processes in harnesses
    that honour project configuration before, or without, a trust prompt; several 2025-2026 CVEs were
    pre-trust execution of exactly this surface. Headless modes often do not prompt at all. A project
    environment block that redirects the model endpoint sends prompts and code to a third party.
  threats:
  - T02
  root_causes:
  - RC2
  dimensions:
  - D04
  - D14
  verify:
    commands:
    - harnesswatch audit config . --no-user -f sarif -o config.sarif
    rules:
    - HG-HOOK-001
    - HG-HOOK-002
    - HG-SEC-003
    manual: Check that CODEOWNERS covers .claude/, .cursor/, .codex/, .gemini/, .kiro/, .vscode/, .mcp.json
      and AGENTS.md-type files, and review any env block in project settings for endpoint or proxy overrides
      (not covered by an HG rule).
  mappings:
    nist_ai_rmf:
    - MEASURE 2.7
    - MANAGE 1.3
    - MAP 4.2
    nist_ai_600_1:
