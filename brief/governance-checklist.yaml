- id: GC-20
  lifecycle: configuration-baseline
  title: Local agent services and control endpoints
  statement: Local or network services started by a harness (IDE bridges, remote-control gateways, WebSocket
    or HTTP control endpoints, agent servers) shall be disabled unless needed; where used they shall bind
    to loopback, require authentication, and validate Origin and Host.
  addresses:
  - vulnerability
  - design-weakness
  rationale: Unauthenticated local endpoints let any web page or local process drive the agent (DNS rebinding,
    cross-site WebSocket hijacking). This is an ordinary access-control defect class, mostly fixed by
    vendors as vulnerabilities, so version currency (GC-29) matters as much as configuration.
  threats:
