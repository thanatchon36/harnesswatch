- id: GC-19
  lifecycle: configuration-baseline
  title: Sub-agent and delegation restrictions
  statement: Sub-agents and delegated agents (including other harnesses invoked by an agent) shall inherit
    the parent session's permission rules or narrower ones, shall have an explicit tool list, and shall
    not be configured with bypass or allow-all modes. Delegation to another harness shall be recorded
    in the register (GC-01).
  addresses:
  - design-weakness
  rationale: A sub-agent with its own bypass mode runs with broader authority than its parent, and content
    handed to it executes without prompts. Delegation chains across harnesses make this hard to see.
  threats:
  - T11
  - T03
  root_causes:
  - RC6
  - RC8
  dimensions:
