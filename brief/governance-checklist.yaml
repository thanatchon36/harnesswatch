- id: GC-11
  lifecycle: configuration-baseline
  title: MCP transport security and authentication
  statement: Remote MCP servers shall be reached only over TLS with authentication (OAuth 2.1 or a token
    supplied from an environment variable or secret store), and only on hosts the organisation trusts.
    Credentials shall not be written as literal values in MCP configuration.
  addresses:
  - design-weakness
  rationale: Plaintext transport exposes tool calls, results and tokens on the network path. Literal secrets
    in MCP configuration are stored in plaintext, copied into backups and, in project files, committed
    for everyone.
