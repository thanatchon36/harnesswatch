- id: GC-02
  lifecycle: before-adoption
  title: Security evaluation before approval
  statement: Before a harness is approved, the organisation shall assess it against the control dimensions
    D01-D16 of the harnesswatch rubric (permission model, sandbox, egress, config trust, MCP governance,
    extensions, secrets, headless/CI, memory, delegation, audit logging, telemetry, distribution, managed
    policy, vulnerability disclosure, local service exposure), record the evidence and its label for each
    score, and document accepted residual risk. A harness without administrator-enforceable settings (D14)
    or without a published security policy and advisories (D15) shall require a documented risk acceptance.
  addresses:
  - design-weakness
  - vulnerability
  rationale: Harnesses differ in which controls exist, which are on by default and which an administrator
    can enforce. A missing safeguard or permissive default (RC6) is a design weakness that will not be
    fixed by patching; it has to be found at procurement. For runtimes and SDKs (tier C) approvals, sandboxing
    and logging are often the application's responsibility and must be built by the adopter.
  threats:
  - T03
  - T17
  - T19
  root_causes:
  - RC6
  - RC8
  - RC10
  dimensions:
  - D01
  - D02
  - D14
  - D15
  - D16
  verify:
    commands:
    - harnesswatch audit supply --online -f json -o supply.json
    rules:
    - HG-SUP-002
    manual: Score the harness with matrix/rubric.md using only facts labelled from-official-docs or verified-by-test;
      record N/A where there is no access. Confirm the vendor publishes a security contact and advisories.
      Keep the scored evidence with the approval record.
