- id: GC-16
  lifecycle: configuration-baseline
  title: Execution sandbox for agent tools, including browser and computer use
  statement: Shell and code execution by agents shall run inside an OS-level sandbox, container or VM
    that limits file-system writes to the workspace and holds no credentials beyond those the task needs.
    Browser and computer-use tools shall run in a separate profile or VM without logged-in organisational
    sessions. Silent fallback to unsandboxed execution shall be disabled where the harness supports it.
  addresses:
  - design-weakness
  - vulnerability
  rationale: Approval prompts and deny rules are policy checks inside the agent process; a sandbox is
    an isolation boundary that still holds when they fail. Sandbox escapes and weak fallbacks are a recurring
    incident class, so the sandbox should be layered with, not instead of, the permission controls.
  threats:
  - T17
  - T12
  - T14
  root_causes:
  - RC8
  - RC11
  dimensions:
  - D02
  - D03
  verify:
    commands:
    - harnesswatch observe <harness-id> --image <image-with-harness> --repo <synthetic-repo> -o observe-<harness-id>.json
      -- <harness command>
    rules: []
    manual: Confirm the sandbox setting in managed configuration and that it is active (observe records
      the sandboxing it detects). From inside an agent session, attempt a write outside the workspace
      and a read of a synthetic credential file; both shall fail.
