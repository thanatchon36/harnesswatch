- id: GC-12
  lifecycle: configuration-baseline
  title: Instruction-file review
  statement: Instruction, rules and skill files that harnesses load automatically (AGENTS.md, CLAUDE.md,
    GEMINI.md, .cursor/rules, copilot-instructions.md, SKILL.md and equivalents) shall be reviewed like
    code, with diffs that reveal hidden and confusable Unicode, and shall not import or tell the agent
    to fetch instructions from remote URLs.
  addresses:
  - design-weakness
  rationale: These files are placed in the model context verbatim. Hidden characters let an author conceal
    instructions from reviewers ('rules file backdoor'), and remote imports make agent behaviour depend
    on content that can change after review. Injection that steers an agent behaving as designed (RC1)
    is not fixed by patching the harness.
