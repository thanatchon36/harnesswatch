- id: GC-15
  lifecycle: configuration-baseline
  title: Secrets in state directories, file modes and transcript retention
  statement: Harness state directories shall be owner-only (0700) and credential, transcript and memory
    files owner-only (0600), including all parent directories on shared hosts, CI runners and dev containers.
    Transcript and log retention shall be configured to the organisation's retention policy, and agents
    shall be denied read access to secret files.
  addresses:
  - design-weakness
  rationale: Harnesses persist transcripts, tool output and memory; any secret that passed through a session
    is then stored at rest, often indefinitely. World-readable state exposes it to every local account
    and to processes running as other users.
  threats:
  - T07
  - T15
  root_causes:
  - RC7
  dimensions:
  - D07
  - D12
  verify:
    commands:
    - harnesswatch audit secrets -f json -o secrets.json
    rules:
    - HG-SEC-001
    - HG-SEC-002
    manual: Findings are redacted; rotate exposed credentials and purge affected session files. Check
      the configured retention setting (e.g. Claude Code cleanupPeriodDays).
