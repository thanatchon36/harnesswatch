# RQ6 governance checklist (machine-readable). brief/governance-checklist.md is rendered from this
# file by scripts/gen_checklist_check.py --write. Mappings are inherited from the cited threat
# classes in taxonomy/mappings.yaml and taxonomy/harness-threats.yaml.
schema_version: 1
id: harnesswatch-governance-checklist
title: Governance checklist for AI coding-agent harnesses
research_question: RQ6
version: '1.0'
date: '2026-10-15'
status: Interpretive synthesis by the harnesswatch authors. Framework mappings are the authors' crosswalk,
  not an endorsement by any framework owner, and not legal or regulatory advice.
sources:
  threat_classes: taxonomy/harness-threats.yaml
  root_causes: taxonomy/root-causes.yaml
  framework_crosswalk: taxonomy/mappings.yaml
  rubric: matrix/rubric.md
  rules: rules/HG-*.yaml
  incident_figures: experiments/results/rq3_incidents.json
lifecycle_stages:
  before-adoption: Before adoption (procurement and evaluation)
  configuration-baseline: Configuration baseline
  runtime-and-ci: Runtime and CI
  monitoring-and-incident-response: Monitoring and incident response
  supplier-management: Supplier management
addresses_kinds:
  vulnerability: A defect the vendor fixes in code, usually with a CVE or GHSA. Managed by patching (GC-29).
  design-weakness: Behaviour that works as specified or by default but is unsafe (permissive default,
    missing safeguard). Managed by configuration, compensating controls or choosing another product.
  policy-choice: A decision with no right answer independent of the organisation (telemetry, retention,
    residency, acceptable autonomy). Managed by deciding explicitly and checking configuration matches.
framework_status:
  nist_ai_rmf:
    label: NIST AI RMF 1.0 (AI 100-1) subcategories
    status: Subcategory statements read on the NIST AIRC Playbook; MEASURE 3.x and MAP 5.x not used (pages
      not read).
  nist_ai_600_1:
    label: NIST AI 600-1 (Generative AI Profile) risks
    status: Referenced by risk name. Section numbers are UNVERIFIED (PDF text not re-read; 2.2, 2.5, 2.6
      and 2.9 corroborated only through the airmkit crosswalk).
  iso_iec_42001:
    label: ISO/IEC 42001:2023 Annex A controls and clauses
    status: 'THIRD-PARTY: Annex A ids and titles cross-read from two public listings; the standard text
      is paywalled and was not read. Confirm in a licensed copy before relying on them. Clause numbers
      are management-system clauses.'
  owasp_llm_2025:
    label: OWASP Top 10 for LLM Applications 2025
    status: 2025 ids. A 2026 edition exists and reportedly renumbers entries; remap once its text is read.
  owasp_agentic:
    label: OWASP Top 10 for Agentic Applications 2026 (ASI)
    status: Names read from the OWASP GenAI Security Project repository; the PDF was not retrieved as
      text.
  owasp_mcp:
    label: OWASP MCP Top 10
    status: UNSTABLE (beta, unversioned project); re-check before publication.
  mitre_atlas:
    label: MITRE ATLAS techniques (release 2026.09)
    status: Every id machine-checked against ATLAS-latest.yaml.
  mas_airm:
    label: MAS Guidelines on AI Risk Management (issued 2026-10-07) and airmkit control ids
    status: Paragraph numbers follow the MAS PDF (hash-matched); only the contents page and paragraph
      5.16 were re-read, other paragraph references are as indexed in airmkit. AIRM-* ids exist in airmkit
      controls.yaml.
preamble: "## 1. Purpose\n\nThis checklist sets the minimum controls an organisation shall have in place\
  \ before and while it uses\nAI coding-agent harnesses: the runtime (CLI, IDE agent, CI action or agent\
  \ SDK) that holds credentials,\nruns shell commands, mounts MCP servers and reads repository configuration\
  \ on the model's behalf. It is\nwritten so that sections 3 to 7 can be adopted as policy text. \"Shall\"\
  \ marks a requirement; a control\nthat a harness cannot technically meet requires a documented risk\
  \ acceptance by the accountable owner.\n\n## 2. Scope and how to read it\n\n- **In scope:** coding-agent\
  \ harnesses on developer endpoints, in dev containers and in CI; agent SDKs and\n  runtimes used to\
  \ build internal agents; MCP servers, skills, plugins and instruction files used with\n  them; the suppliers\
  \ of all of these.\n- **Out of scope:** model selection and model-level evaluation, except where a harness\
  \ control depends on it.\n- **Regulated financial institutions.** Each control maps to the MAS Guidelines\
  \ on AI Risk Management\n  through the airmkit control vocabulary (AIRM-* ids). Per paragraph 1.8 as\
  \ indexed in airmkit, MAS expects\n  Sections 3-4 from 2027-10-07 and Sections 5-6 by 2028-10-07. The\
  \ guidelines apply to AI agents.\n  Mappings to NIST AI RMF, ISO/IEC 42001, OWASP and MITRE ATLAS support\
  \ institutions under other regimes.\n- **What a control addresses.** Each control says whether it manages\
  \ a *vulnerability* (a defect the vendor\n  fixes), a *design weakness* (an unsafe default or missing\
  \ safeguard) or a *policy choice* (for example\n  telemetry). These are managed differently and are\
  \ not conflated.\n- **Verification.** Where a `harnesswatch` command and HG rule exist they are given;\
  \ otherwise the check is\n  manual. A passing `harnesswatch` audit shows that the listed rules did not\
  \ fire. It is not evidence that the\n  control is met.\n- **Mappings** are inherited from the threat\
  \ classes each control cites, using `taxonomy/mappings.yaml`\n  and `taxonomy/harness-threats.yaml`.\
  \ Flags such as UNVERIFIED and THIRD-PARTY are carried over (see\n  section 8). No framework identifier\
  \ appears here that is not in those files.\n\n### Context from the incident survey\n\n`experiments/results/rq3_incidents.json`\
  \ counts {{rq3:counted}} harness incidents disclosed in 2025-2026\n(verified primary source and an independent\
  \ ID check). By kind: {{rq3:by_kind.vulnerability}}\nvulnerabilities, {{rq3:by_kind.design-weakness}}\
  \ design weaknesses, {{rq3:by_kind.supply-chain}} supply-chain\ncompromises, {{rq3:by_kind.misuse}}\
  \ cases of misuse and {{rq3:by_kind.incident}} operational incidents. Of\n{{rq3:patch_latency_days.n}}\
  \ incidents with both dates known, {{rq3:patch_latency_days.fixed_before_disclosure}}\nwere fixed on\
  \ or before public disclosure. Per-control incident counts below come from\nthe same file (`by_taxonomy_class`).\
  \ Incident counts reflect what researchers examined, not residual\nrisk, and are not used to weight\
  \ controls.\n"
closing: '## 9. Maintenance


  Review this checklist when the taxonomy, rule pack or a referenced framework changes, and at least

  annually. `scripts/gen_checklist_check.py` checks that every HG rule, threat class, root cause, rubric

  dimension and framework id referenced in `brief/governance-checklist.yaml` exists in `rules/` or

  `taxonomy/`, that each framework id is supported by a threat class the control cites, and that this
  page

  matches the YAML. Run `uv run python scripts/gen_checklist_check.py --write` to re-render it after

  editing the YAML.

  '
controls:
- id: GC-01
  lifecycle: before-adoption
  title: Harness inventory and approval register
  statement: The organisation shall maintain a register of every agent harness, IDE agent, agent SDK,
    MCP server, skill and plugin approved for use, recording for each the owner, version, permission mode,
    tools and MCP servers it can reach, sub-agents it can start, and the data classes it may process.
    Harnesses not on the register shall not be used with organisational code, data or credentials.
  addresses:
  - policy-choice
  - design-weakness
  rationale: 'Unregistered harnesses and extensions are a shadow-AI surface: they hold developer credentials
    and run shell commands outside any review. The register is also where the per-agent attributes (tools,
    guardrails, delegation) that later controls depend on are recorded.'
  threats:
  - T05
  - T11
  - T16
  root_causes:
  - RC5
  - RC12
  dimensions:
  - D14
  - D06
  - D10
  verify:
    commands:
    - harnesswatch inventory --json .
    - harnesswatch audit supply --sbom harness-sbom.cdx.json -f json -o supply.json
    rules: []
    manual: Run the inventory on a sample of developer endpoints, build agents and dev containers and
      reconcile the detected harnesses, state directories and repository harness files with the register.
      Any detected harness or MCP server absent from the register is a finding.
