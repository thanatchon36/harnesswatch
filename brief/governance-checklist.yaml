- id: GC-27
  lifecycle: monitoring-and-incident-response
  title: Harness-specific incident response
  statement: 'The incident-response plan shall cover agent-harness incidents, including: revoking and
    rotating credentials the harness could reach; purging transcripts, memory and caches that hold secrets
    or injected instructions; removing or disabling MCP servers, skills and plugins; stopping running
    agents; detecting unapproved or attacker-operated harness use; and notifying the supplier and, where
    required, the supervisor.'
  addresses:
  - vulnerability
  - design-weakness
  - policy-choice
  rationale: A compromised harness session leaves state in places conventional playbooks do not cover
    (transcripts, memory, MCP tokens). Attackers also operate harnesses as tools; detecting that is an
    incident-management task, not a product fix.
  threats:
  - T16
