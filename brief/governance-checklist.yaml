- id: GC-22
  lifecycle: runtime-and-ci
  title: Least-privilege GITHUB_TOKEN and agent identities
  statement: Every CI job that runs an agent shall declare an explicit permissions block with read-only
    scopes, granting only the single write scope the job needs. Agent jobs shall use dedicated identities
    with no production credentials, and branch protection shall require human review of agent-authored
    changes.
  addresses:
  - design-weakness
  rationale: A default or write-scoped token lets a steered agent push commits, edit workflows or publish
    packages. Least privilege bounds the blast radius of a successful injection.
