- id: GC-29
  lifecycle: supplier-management
  title: SBOM, advisories and patch deadlines
  statement: The organisation shall keep an SBOM of installed harnesses, subscribe to each supplier's
    security advisories, and apply security fixes for harnesses within a defined deadline set by severity.
    Versions with known exploitable advisories shall not remain in use past that deadline.
  addresses:
  - vulnerability
  rationale: Most counted harness incidents are vulnerabilities, and fixes are usually available by the
    time an advisory is published (see context figures), so the exposure window is set mainly by how fast
    adopters upgrade.
