- id: GC-06
  lifecycle: configuration-baseline
  title: Managed permission mode and bypass lock
  statement: Where the harness supports administrator-managed settings, the organisation shall deploy
    them to every managed endpoint so that the default permission mode asks before shell commands, file
    writes outside the workspace and network tools, and so that approve-everything modes (bypass, YOLO,
    full-auto, never-ask) cannot be enabled by users or repositories. Bypass modes are permitted only
    in disposable environments that hold no organisational credentials.
  addresses:
  - design-weakness
  rationale: 'In approve-everything mode every successful injection reaches the shell directly. Settings
    that users or a committed repository file can change do not constitute a control; managed settings
    with precedence over user and project scope do. Examples: Claude Code permissions.disableBypassPermissionsMode,
    Gemini CLI security.disableYoloMode, Codex requirements.toml.'
  threats:
  - T03
  - T14
  root_causes:
  - RC6
  - RC11
  dimensions:
  - D01
  - D14
  verify:
    commands:
    - harnesswatch audit config . --user -f json -o config.json
    rules:
    - HG-PERM-001
    manual: Confirm the managed settings file (e.g. /etc/claude-code/managed-settings.json) is present,
      root-owned and not user-writable, and contains the bypass lock. Then try to start the harness in
      bypass mode as an ordinary user and confirm it refuses.
