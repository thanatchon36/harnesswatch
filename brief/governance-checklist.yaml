- id: GC-24
  lifecycle: runtime-and-ci
  title: Human approval and stop control for irreversible actions
  statement: Irreversible or high-impact actions by agents (deleting data, force-pushing, changing production
    infrastructure, sending external communications, moving money) shall require explicit human approval
    outside the agent's own permission prompt, and the organisation shall be able to stop running agents
    and revoke their credentials promptly.
  addresses:
  - design-weakness
  rationale: Destructive actions can occur with no attacker involved, when the agent exceeds the user's
    intent without an enforced guardrail (RC11). Deny rules reduce the likelihood; approval gates and
    a stop control limit the impact.
  threats:
  - T14
  root_causes:
  - RC11
  dimensions:
