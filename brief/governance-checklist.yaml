  title: Credentials outside harness configuration files
  statement: Model-provider keys, tokens and other credentials used by harnesses shall be held in the
    OS keychain, an organisational secret manager or a credential helper, and shall not be written as
    literal values in user, project or MCP configuration. Harness sessions shall use scoped, short-lived
    credentials where the provider supports them.
