# Framework crosswalk (generated in Phase 2).
schema_version: 1
title: Framework-level crosswalk for the harnesswatch threat taxonomy (RQ1, RQ6)
status: final for Phase 2; 2026-10-15. Interpretive mapping by the authors, not an endorsement by any framework
  owner.
frameworks:
  nist_ai_rmf:
    name: NIST AI Risk Management Framework 1.0 (NIST AI 100-1)
    url: https://airc.nist.gov/AI_RMF_Knowledge_Base/Playbook
    accessed: '2026-10-15'
    verification: Subcategory statements for every id used (GOVERN 1.1, 3.2, 4.3, 6.1, 6.2; MAP 3.5, 4.1,
      4.2; MEASURE 2.4, 2.6, 2.7, 2.8, 2.10; MANAGE 1.3, 2.2, 2.3, 2.4, 3.1, 4.1, 4.3) were read on the NIST AIRC
      Playbook pages; MEASURE 3.x and MAP 5.x pages were truncated in the fetch and are not used.
  nist_ai_600_1:
    name: 'NIST AI 600-1, Artificial Intelligence Risk Management Framework: Generative AI Profile'
    published: '2024-07-26'
    url: https://doi.org/10.6028/NIST.AI.600-1
    accessed: '2026-10-15'
    verification: 'Publication date read from nist.gov. The PDF text could not be extracted in this environment,
      so the twelve risk names and the section numbers 2.1-2.12 were not re-read: names are the standard ones and
      are referenced by NAME; numbers 2.2, 2.5, 2.6 and 2.9 are corroborated by the authors'' airmkit crosswalk,
      other numbers follow alphabetical order and are unverified.'
    risk_names:
    - CBRN Information or Capabilities
    - Confabulation
    - Dangerous, Violent, or Hateful Content
    - Data Privacy
    - Environmental Impacts
    - Harmful Bias and Homogenization
    - Human-AI Configuration
    - Information Integrity
    - Information Security
    - Intellectual Property
    - Obscene, Degrading, and/or Abusive Content
    - Value Chain and Component Integration
  iso_iec_42001:
    name: ISO/IEC 42001:2023 Information technology - Artificial intelligence - Management system
    url: https://www.iso.org/standard/81230.html
    accessed: '2026-10-15'
    verification: 'Annex A control ids and titles cross-read from two public listings that agree (riskprofs.com/iso-42001-annex-a-controls-list,
      blckalpaca.at annex-a page); a third listing (certpro.com) used different numbering and was rejected. The
      standard text is paywalled and was not read: confirm in a licensed copy before publication. Clause-level ids
      (6.1.2, 6.1.4, 7.5, 8.2-8.4, 9.1, 10.2) are management-system clauses.'
    annex_a_titles:
      A.2.2: AI policy
      A.3.3: Reporting of concerns
      A.4.3: Data resources
      A.4.4: Tooling resources
      A.4.5: System and computing resources
      A.5.4: Assessing impacts on individuals or groups
      A.6.1.3: Processes for responsible design and development
      A.6.2.4: AI system verification and validation
      A.6.2.5: AI system deployment
      A.6.2.6: AI system operation and monitoring
      A.6.2.7: AI system technical documentation
      A.6.2.8: AI system recording of event logs
      A.7.3: Acquisition of data
      A.7.4: Quality of data for AI systems
      A.7.5: Data provenance
      A.8.2: System documentation and information for users
      A.8.4: Communication of incidents
      A.9.2: Processes for responsible use of AI systems
      A.9.3: Objectives for responsible use of AI systems
      A.9.4: Intended use of the AI system
      A.10.2: Allocation of responsibilities
      A.10.3: Suppliers
      A.10.4: Customers
  mas_airm:
    name: MAS Guidelines on Artificial Intelligence Risk Management
    issued: '2026-10-07'
    status: 'Final (consultation P017-2025 ran 2025-11-13 to 2026-01-31). Supervisory expectations. Per paragraph
      1.8 as indexed in airmkit: Sections 3-4 expected from 2027-10-07, Sections 5-6 by 2028-10-07.'
    sections:
      '1': Introduction
      '2': Application of the Guidelines
      '3': AI Oversight
      '4': Key AI Risk Management Systems, Policies and Procedures
      '5': AI Life Cycle Controls
      '6': AI Capability & Capacity
    url: https://www.mas.gov.sg/-/media/mas-media-library/regulation/guidelines/bd/guidelines-on-artificial-intelligence-risk-management-for-financial-institutions/guidelines-on-artificial-intelligence-risk-management.pdf
    accessed: '2026-10-15'
    verification: PDF downloaded; SHA-256 d9a4095569da34078e2cd597cc992910e63cf88471c59cb654c0413dbaed5c6d matches
      the hash recorded in airmkit docs/sources/MANIFEST.md; contents page and paragraph 5.16 read. The MAS HTML
      landing pages returned 404/maintenance, so the media-release wording was not re-read. Paragraph-level clause
      references below use the numbering of the PDF.
  airmkit:
    name: airmkit control vocabulary (user project)
    url: https://github.com/thanatchon36/airmkit
    path: src/airm/controls/controls.yaml
    accessed: '2026-10-15'
    verification: Every AIRM-* id below was checked to exist in controls.yaml (63 controls at read time). harnesswatch
      checklist items should slot under these ids; no new ids are invented here.
notes:
- 'Coverage is thematic: a framework item is listed when the threat class is a plausible subject of that item, not
  when the item prescribes a control for it.'
- ISO 42001 and NIST AI RMF are voluntary; MAS AIRM is supervisory expectation for Singapore financial institutions
  and applies to AI agents (paragraph 1.11, 1.5).
- 'Harness-specific mappings to airmkit: AIRM-4.8-FN25-AGENT-ATTRIBUTES (record tools/guardrails per agent) and
  AIRM-5.16-AGENT-PERMISSIONS are the natural landing points for the governance checklist.'
