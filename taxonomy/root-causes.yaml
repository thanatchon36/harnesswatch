# Final root-cause classes (generated in Phase 2).
schema_version: 1
title: Final root-cause classes for harness incidents (RQ3)
status: final for Phase 2; 2026-10-15
unit: 'One root cause per incident row: the failed engineering control that, had it held, would have prevented the
  harm.'
procedure:
- Apply the questions in order and stop at the first yes. Two raters following the order on the same facts get the
  same class.
- Q1 Is the row kind = misuse (adversary operates the harness, no defect)? -> RC12.
- Q2 Is the harm caused by a malicious/tampered/hijacked artifact or failed artifact-integrity check? -> RC5.
- Q3 No adversary, and the agent took a destructive action beyond intent? -> RC11.
- Q4 Was a sandbox/container/interpreter/browser isolation boundary crossed or silently weakened? -> RC8.
- Q5 Did a protection exist (or is a standard safeguard absent) and the issue is its permissive/off default or an
  over-privileged mode, fixed by changing a default or list? -> RC6.
- Q6 Was untrusted or agent-written workspace content executed/applied as configuration, or a trust gate bypassed?
  -> RC2.
- Q7 Does the endpoint lack authentication, Origin or Host validation? -> RC4.
- Q8 Is a deterministic check that gates an agent capability (approval, allowlist, path, URL, scope, tenant) logically
  wrong? -> RC3.
- Q9 Is it an ordinary code defect (deserialization, injection from non-model input, XSS, race, DoS) not gating
  an agent capability? -> RC10.
- Q10 Did the harness itself expose or send data (permissions, logs, wrong-origin token, upload, leaked release)?
  -> RC7.
- Q11 Did a rendering/auto-fetch feature carry attacker-chosen data out without an explicit permitted tool call?
  -> RC9.
- Q12 Otherwise, injected content steered an agent that behaved as designed -> RC1.
kind_rule:
  vulnerability: A defect fixed in code or configuration logic by the vendor, or assigned a CVE/GHSA as a bug.
  design-weakness: Behaviour that works as specified or by default but is unsafe; fixed by changing a default, adding
    a control or documenting; usually no CVE. Policy choices (telemetry defaults) are recorded here and not counted
    as vulnerabilities.
  supply-chain: Compromise or tampering of a package, extension or update channel.
  misuse: Adversary operates the harness as a tool; no defect.
  incident: Operational event (exposure, release error, destructive agent run) that is not a single defect.
changes:
- Kept RC1-RC9 ids with tightened definitions.
- RC6 widened to include missing safeguards and takes precedence over RC2/RC3/RC4 when a protection exists but is
  off by default.
- RC9 narrowed to rendering/auto-fetch side-effect channels.
- NEW RC10 conventional implementation defect, RC11 autonomous action exceeding intent, RC12 adversarial use.
- Re-classification changed the draft root cause on 97 of 328 rows and the draft taxonomy class on 128 rows (see
  movement matrices).
