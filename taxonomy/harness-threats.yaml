  - D02
  rules:
  - HG-SUB-001
  incident_count: 3
  examples:
  - G3-I021
  - G7-I090
  - G7-I110
  distinguishes: 'Multi-agent delegation multiplies confused-deputy paths: a low-privilege agent that reads untrusted
    data can instruct a high-privilege one. Classic LLM apps with a single model call have no inter-agent channel.'
- id: T12
  name: Browser and computer-use surfaces
  definition: Agents that drive a browser or the desktop expose session cookies, same-profile logins, screenshots
    and page content to the model, and web content can act on the agent (clickbait, crafted pages) or reach local
    services from the browser's network position.
  harness_surfaces:
  - built-in or controlled Chromium (Antigravity, Cursor cloud agent browser)
  - computer-use tools
  - browser profile and cookies
  - screenshots and DOM extraction
  - local agent endpoints reachable from the browser
