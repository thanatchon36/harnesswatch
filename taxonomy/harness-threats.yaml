  distinguishes: Mostly classic multi-tenant authorization, but the stateful, tool-holding nature of an agent session
    means a cross-tenant mistake exposes credentials and tool access, not just records.
  mapping_notes: OWASP LLM Top 10 2025 has no dedicated authorization entry; LLM02 is the closest.
- id: T14
  name: Destructive and unsafe autonomous actions
  definition: The agent, without any attacker, takes irreversible actions beyond what the user intended (deleting
    data or drives, force-push, production migrations, ignoring a declared freeze), usually under auto-approve or
    with production credentials in reach. Impact depends on blast radius controls rather than on a bug.
  harness_surfaces:
  - auto-approve / turbo modes
  - cloud CLIs and database credentials in the environment
  - git force operations
  - instruction-following under code freeze or protected branches
