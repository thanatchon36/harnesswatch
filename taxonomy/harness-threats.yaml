  distinguishes: Page content is attacker-controlled by construction and the agent acts with the user's logged-in
    identity; a chat app without browsing has no such surface.
- id: T13
  name: Multi-tenant isolation and authorization
  definition: 'Shared or hosted agent services fail to separate users, tenants, assistants, sessions or stores:
    missing or ignored authorization decorators, namespace prefix matching across tenants, session identifiers accepted
    without a principal check, client-supplied metadata trusted to reference another tenant''s files.'
  harness_surfaces:
  - agent platform APIs (assistants, runs, threads, stores)
  - custom auth handlers and resource decorators
  - shared MCP server/transport instances
  - cloud sandboxes and shared workspaces
  - collaboration links
  stride:
