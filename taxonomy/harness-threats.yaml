  distinguishes: Here the harness is the attacker's tool rather than the victim; the relevant defender controls
    are account and abuse monitoring by the vendor and audit logging by the customer.
  mapping_notes: ASI10 (Rogue Agents) concerns agents deviating from intended behaviour; the fit with attacker-operated
    agents is loose, so treat as indicative.
- id: T17
  name: Execution sandbox and isolation escape
  definition: 'The OS-level or interpreter-level boundary that confines agent-executed code (Seatbelt, bubblewrap,
    Landlock, containers, restricted Python interpreters) is bypassed or silently absent: symlink and path confusion,
    TOCTOU, writes to config or git hooks that an unsandboxed component honours later, leaky network or DNS policy,
    and weak fallbacks when the container runtime is missing.'
  harness_surfaces:
  - sandbox profiles and writable-root lists
  - restricted Python executors (smolagents LocalPythonExecutor, code interpreters)
  - git hooks and settings files writable from inside the sandbox
  - container/VM runtime fallback logic
  - sandbox network proxy
  stride:
  - E
  mitre_atlas:
  - AML.T0105
  - AML.T0097
