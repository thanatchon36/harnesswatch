  distinguishes: A coding harness streams source code and shell output to a vendor by design, so data governance
    becomes a security property; for chat apps the data is user-typed text.
  mapping_notes: ATLAS has no technique for vendor-side collection or audit gaps, so mitre_atlas is empty by design.
- id: T16
  name: Offensive misuse of harnesses by attackers
  definition: Threat actors use agent harnesses as operational tooling (reconnaissance, credential hunting, orchestration,
    extortion). Recorded descriptively from vendor threat reports; no technique detail is collected and the class
    describes use, not a product defect.
  harness_surfaces:
  - agent CLIs run with attacker-held accounts
  - autonomous orchestration of sub-agents
  - MCP tooling used for scanning
