  - ASI03
  owasp_mcp:
  - MCP06
  controls:
  - D08
  - D01
  - D14
  - D07
  rules:
  - HG-CI-001
  - HG-CI-002
  incident_count: 8
  examples:
  - G7-I027
  - G2-I004
  - G7-I023
  - G7-I118
  - G7-I116
  distinguishes: 'The attacker needs no foothold on a developer machine: a public issue is enough, and the agent
    runs inside the organisation''s CI trust boundary with secrets. This is the pwn-request pattern from CI security
    with a model as the confused deputy.'
- id: T10
  name: Persistent memory and long-lived context poisoning
  definition: Content that the agent can write into persistent stores which later sessions load as trusted context
    (memory files, notes, summaries produced by context compression, shared project memory, learned skills) lets
    one-time injection become standing instruction. The store may also be committed to version control and shared.
  harness_surfaces:
  - CLAUDE.md auto-memory and ~/.claude/projects memory
  - Hermes memory tool and context compression
  - omp Hindsight
  - OpenClaw memory and heartbeat files
  - thread summaries and compaction output
