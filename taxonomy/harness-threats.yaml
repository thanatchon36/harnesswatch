  - D13
  - D15
  - D14
  rules:
  - HG-HOOK-002
  - HG-INJ-003
  - HG-MCP-001
  - HG-SUP-001
  - HG-SUP-002
  incident_count: 12
  examples:
  - G6-077
  - G6-078
  - G7-I111
  - G7-I113
  - G2-I003
  - G7-I026
  - G6-071
  distinguishes: 'Harnesses are installed on developer machines that hold cloud and source-control credentials,
    and they are scriptable by other malware: the incident set shows packages that weaponise an installed agent
    with auto-approve flags as the exfiltration tool.'
- id: T07
  name: Secret exposure and residue
  definition: 'Credentials and sensitive data are stored, logged or exposed by the harness in ways that exceed what
    the user expects: plaintext tokens, world-readable state directories, secrets copied into transcripts, memory,
    traces or exports, and race conditions on credential files. The harness itself, not an attacker-steered agent,
    is the source of the exposure.'
  harness_surfaces:
  - ~/.claude/.credentials.json, ~/.codex/auth.json, ~/.pi/auth.json and equivalents
  - session transcripts, trajectories, response stores
  - OpenTelemetry spans and exported HTML sessions
  - MCP server env/headers in config
  - file modes of state directories
  stride:
  - I
  mitre_atlas:
  - AML.T0055
  - AML.T0083
  - AML.T0037
  - AML.T0098
  owasp_llm_2025:
  - LLM02
  owasp_agentic:
  - ASI03
  owasp_mcp:
  - MCP01
  controls:
  - D07
  - D11
  - D12
  rules:
  - HG-MCP-003
  - HG-PERM-003
  - HG-SEC-001
  - HG-SEC-002
  - HG-SEC-003
  incident_count: 10
  examples:
  - G3-I003
  - G3-I014
  - G5b-I09
  - G5a-I14
  - G5a-I15
  distinguishes: 'A harness persists far more than a chat app: long transcripts that include tool output (so file
    contents and env dumps), credentials for model providers and MCP servers, and traces. Once the agent runs `cat
    .env` the secret is in the transcript for the retention period.'
- id: T08
  name: Data exfiltration channels
  definition: 'Paths by which data in the agent''s context leaves the machine: automatic Markdown image or link
    rendering, fetch tools and their URL or domain filters, pre-approved domains, DNS via ''safe'' commands, schema-reference
    fetches, browser tools, git push and MCP egress. Applies when the net capability gained is egress; approval
    bypasses that give arbitrary execution are T03.'
  harness_surfaces:
  - WebFetch/web search domain allowlists and preapproved lists
  - Markdown image/mermaid rendering in chat UIs
  - commands classed as safe (ping, nslookup, curl)
  - JSON-schema $ref resolution
  - sandbox network policy
  - browser tool allowlists
  stride:
  - I
  mitre_atlas:
  - AML.T0086
  - AML.T0077
  - AML.T0025
  - AML.T0057
  owasp_llm_2025:
  - LLM02
  - LLM05
  owasp_agentic:
  - ASI02
  owasp_mcp:
  - MCP10
  controls:
  - D03
  - D02
  - D01
  rules:
  - HG-CI-001
  - HG-HOOK-002
  - HG-INJ-002
  - HG-MCP-002
  - HG-NET-001
  incident_count: 23
  examples:
  - G6-067
  - G6-022
  - G1-I006
  - G7-I035
  - G2-I005
  - G1-I021
  distinguishes: Rendering-based exfiltration exists in chat apps, but a harness adds shell, git and browser egress
    and holds the data that is worth stealing (source, .env, keys). The lethal combination of private data, untrusted
    content and an outbound channel is routinely present by default.
- id: T09
  name: Headless and CI abuse (pwn request)
  definition: Agents run non-interactively in CI or issue/PR automation with repository secrets or write tokens
    while their prompt includes text written by untrusted parties (issue titles, PR bodies and branch names, comments,
    repo-local config from the PR head). No human is present to approve, so every control depends on static configuration.
  harness_surfaces:
  - claude -p, codex exec, gemini/grok/agy headless modes
  - official actions (claude-code-action and similar)
  - pull_request_target / issue_comment / issues triggers
  - GITHUB_TOKEN permissions and secrets in agent steps
  - Actions cache
  - branch-name and title interpolation into shell steps
  stride:
  - E
  - I
  - T
  mitre_atlas:
  - AML.T0051.001
  - AML.T0093
  - AML.T0119
  - AML.T0053
