classification_rule:
- Each incident gets exactly one primary class, chosen by the first applicable step below (the control that failed
  first on the attack path), so two raters converge. Secondary classes may be recorded outside this file.
- 1. kind = misuse (attacker operates the harness; no product defect) -> T16.
- 2. Harness package, release or update channel compromised, or vendor release leaked internals -> T06; malicious
  or tampered skill/plugin/extension or its pin/signature verification -> T05; malicious MCP package -> T04.
- 3. Execution sandbox or interpreter boundary crossed (including writes from inside the sandbox that an unsandboxed
  component later honours) -> T17. A browser-surface boundary -> T12.
- 4. Control endpoint (HTTP/WebSocket/gateway/webhook/pairing/scope) lacks authentication, Origin/Host validation
  or correct scoping -> T18.
- 5. Tenant, user or session separation on a shared/hosted service -> T13.
- 6. Vendor-side data flow (telemetry, whole-workspace upload, retention) or missing audit log -> T15.
- 7. Destructive action with no attacker involved -> T14.
- 8. Non-interactive CI/automation workflow consuming untrusted trigger text -> T09.
- 9. Persistent memory/context store -> T10; delegation to sub-agents or other harnesses -> T11.
- 10. MCP protocol trust (tool definitions, approval binding/re-approval, OAuth, install deeplink, registry) ->
  T04.
- 11. Repository, workspace or agent-writable configuration/file honoured or executed (including git config, workspace
  executables, folder names) -> T02.
- 12. Approval, allowlist, path or command-validation logic or permissive default permission mode -> T03; if the
  only capability gained is data egress through a permitted command or filter -> T08.
- 13. Output rendering, fetch tools, URL/domain filters, DNS or allowed-host egress -> T08.
- 14. Credential/state storage, logging or telemetry content exposed by the harness itself -> T07.
- 15. Conventional code defect (deserialization, SQL/argument/XSS injection, DoS, temp-file race) not gating an
  agent capability -> T19.
- 16. Otherwise (injected content steers a harness that behaved as designed) -> T01.
changes:
- No MISSION seed id (T01-T16) was renumbered or retired; ids are stable.
- 'T01 clarified: primary class only when no later control failed; otherwise it is the entry vector.'
- T02 extended with git configuration (core.fsmonitor, core.hooksPath), workspace-resident executables, project
  .env and agent-writable execution-sensitive files.
- T03 clarified to the approval/allowlist/path/permissive-default layer; sandbox escapes moved to T17 and control-plane
  authorization to T18.
- T04 narrowed to MCP protocol trust issues; MCP server code bugs are classified by mechanism (T03, T18, T19).
- T13 narrowed from "collab links, shared sessions" to multi-tenant isolation and authorization.
- T15 now includes audit-log gaps; T16 stays descriptive-only.
- NEW T17 Execution sandbox and isolation escape (RC8 incidents were scattered over T03/T02/T11).
- NEW T18 Agent control-plane exposure and authorization (unauthenticated local/network services, DNS rebinding,
  CSWSH, pairing/scope escalation; scattered over T03/T07/T08/T04 in the drafts).
- NEW T19 Conventional software defects in agent runtimes and SDKs (deserialization, SQLi, XSS, DoS; previously
  forced into T07/T08/T03 or unmapped).
- Draft incident classes were reassigned by the ordered rule above; see taxonomy/incident-classification.csv.
gaps:
- No rule in rules/ targets T12, T13, T16, T17, T18 or T19; T05 and T10 have one or two partial rules. See reports/phase2_notes.md
  for proposed rules.
classes:
- id: T01
  name: Indirect prompt injection via workspace and retrieved content
  definition: Attacker-authored text that the harness places in the model context (instruction files such as AGENTS.md/CLAUDE.md/.cursorrules,
    README and code comments, issues and PRs, fetched web pages, tool results, hidden Unicode) steers the agent
    to use its granted tools. In this taxonomy T01 is the primary class only when the harness behaved as designed
    and no separate permission, config-trust, egress or sandbox control failed; otherwise the failed control's class
    is primary and T01 is the entry vector.
  harness_surfaces:
  - AGENTS.md
  - CLAUDE.md
  - .cursor/rules/*
  - .cursorrules
  - .github/copilot-instructions.md
  - GEMINI.md
  - README/code comments/test fixtures read by the agent
  - issue/PR bodies and comments pulled by tools
  - web fetch and tool results
  - hidden Unicode tag/bidi/zero-width characters
  stride:
  - T
  - E
  mitre_atlas:
  - AML.T0051.001
  - AML.T0093
  - AML.T0068
  - AML.T0094
  owasp_llm_2025:
  - LLM01
  owasp_agentic:
  - ASI01
  owasp_mcp:
  - MCP06
  controls:
  - D01
  - D02
  - D03
  - D04
  - D11
  rules:
  - HG-CI-001
  - HG-INJ-001
  - HG-INJ-002
  - HG-INJ-003
  - HG-MCP-004
  - HG-PERM-001
  incident_count: 15
  examples:
  - G6-073
  - G6-075
  - G4-I037
  - G4-I022
  - INC-G5d-019
  distinguishes: Classic LLM-app injection ends in a bad answer or leaked system prompt; in a harness the injected
    text is read from a developer's own repository or a tool result and the model holds shell, file-write and network
    tools, so the same string becomes code execution or exfiltration. Instruction files are also versioned, shared
    and loaded automatically, which makes the injection persistent and supply-chain-distributable. Output filtering
    does not help because the payload is the agent's actions, not its text.
- id: T02
  name: Repository and workspace configuration as code execution
  definition: Files that live in or are written into the workspace (hooks, MCP server definitions, IDE task files,
    workspace settings, project plugins, git configuration, workspace-resident executables, env files) are executed
    or honoured by the harness or its host IDE without the consent the product claims to require. This covers pre-trust
    execution, trust-dialog bypass, and configuration that the agent itself can write and that later runs unsandboxed.
  harness_surfaces:
  - .claude/settings.json and settings.local.json hooks
  - .cursor/hooks.json, .cursor/mcp.json, .cursor/cli.json
  - .kiro/hooks, .kiro/settings
  - .codex/config.toml
  - opencode.json
  - .vscode/tasks.json (runOn folderOpen), .vscode/settings.json, *.code-workspace
  - .mcp.json
  - .git/config (core.fsmonitor, core.hooksPath), git attributes filters
  - project .env files
  - workspace-resident executables found via search path
  stride:
  - E
  - T
  mitre_atlas:
  - AML.T0081
  - AML.T0050
  - AML.T0053
  owasp_llm_2025:
  - LLM06
  owasp_agentic:
  - ASI05
  - ASI02
  owasp_mcp:
  - MCP09
  controls:
  - D04
  - D01
  - D02
  - D05
  - D14
  rules:
  - HG-HOOK-001
  - HG-HOOK-002
  - HG-MCP-005
  - HG-MCP-006
  incident_count: 52
  examples:
  - G1-I028
  - G4-I002
  - G1-I013
  - G4-I020
  - G7-I032
  - G1-I040
  - G6-080
  distinguishes: A classic LLM app has no notion of a working directory whose contents are executable configuration;
    an agent harness inherits the IDE/CLI 'open folder' trust problem and adds an agent that can write those same
    files. The attack needs no model misbehaviour at all when the config is merely cloned, which puts it closer
    to malicious-repository attacks on editors than to prompt injection.
- id: T03
  name: Permission-model weaknesses and approval bypass
  definition: 'The mechanism that decides which tool calls, commands, paths and domains run without human approval
    is wrong, over-broad or defeated: allowlist matching on command prefixes, shell parsing differences, path or
    symlink checks, TOCTOU, over-permissive defaults and approve-everything modes. The harness believes a user approved
    or a policy permitted an action that in effect it did not.'
  harness_surfaces:
  - permissions.allow/deny rules (Bash(*), prefix allowlists)
  - auto-approve / YOLO / bypassPermissions / full-auto flags and settings
  - command parsers and safe-command lists (sed, find, echo, rg, git, env-var prefixes)
  - path restriction, .gitignore-style ignore files, protected-path lists
  - symlink and junction handling
  - managed-settings precedence
  stride:
  - E
  - T
  mitre_atlas:
  - AML.T0053
  - AML.T0050
  - AML.T0102
  owasp_llm_2025:
  - LLM06
  owasp_agentic:
  - ASI02
  - ASI03
  owasp_mcp:
  - MCP02
  controls:
  - D01
  - D02
  - D14
  rules:
  - HG-MCP-006
  - HG-PERM-001
  - HG-PERM-002
  - HG-SUB-001
  incident_count: 67
  examples:
  - G1-I023
  - G4-I004
  - G2-I011
  - G1-I026
  - G7-I106
  - G1-I032
  distinguishes: Classic LLM apps rarely execute model output; in a harness the approval layer is the primary security
    boundary between a manipulable model and the OS, and it is implemented as string and path matching over free-form
    shell, which is notoriously bypassable. Defective checks of this kind (root cause RC3) are the largest single
    root cause in the incident set.
- id: T04
  name: 'MCP trust: tool poisoning, rug pulls, OAuth and server identity'
  definition: 'Trust failures specific to Model Context Protocol and similar tool protocols: tool descriptions or
    results that carry instructions, definitions that change after approval, project-supplied servers started or
    auto-approved without a prompt, install deeplinks that hide arguments, OAuth flows that send credentials to
    a server-chosen authorization server, and malicious or typosquatted MCP packages. Vulnerabilities in MCP server
    code are classified by their mechanism (T03, T18, T19), not here.'
  harness_surfaces:
  - .mcp.json, mcpServers in settings, per-harness MCP config
  - tool name/description/schema fields shown to the model
  - tool-approval and re-approval state
  - MCP install deeplinks (cursor://, vscode:)
  - MCP OAuth discovery and token storage
  - MCP registries and npx/uvx launch commands
  stride:
  - S
  - T
  - E
  mitre_atlas:
  - AML.T0110
  - AML.T0109
  - AML.T0011.002
  - AML.T0010.005
  - AML.T0099
  - AML.T0131
  owasp_llm_2025:
  - LLM03
  - LLM01
  - LLM06
  owasp_agentic:
  - ASI04
  - ASI02
  owasp_mcp:
  - MCP03
  - MCP04
  - MCP05
  - MCP07
  - MCP09
  - MCP10
  controls:
  - D05
  - D14
  - D06
  - D13
  - D03
  rules:
  - HG-MCP-001
  - HG-MCP-002
  - HG-MCP-003
  - HG-MCP-004
  - HG-MCP-005
  - HG-MCP-006
  incident_count: 13
  examples:
  - G6-074
  - G4-I001
  - G6-086
  - G6-051
  - G7-I096
  - G7-I070
  distinguishes: 'The tool catalogue is itself model input: a server can change what the model sees after the user
    approved it, and tool results re-enter the context, so supply-chain and prompt-injection risk merge. A chat
    app with plugins has the same shape, but harness MCP servers run as local processes with the developer''s credentials.'
- id: T05
  name: Skills, plugins, extensions and marketplaces
  definition: Installable capability bundles for the harness or its host IDE (skills with SKILL.md, plugins, extensions,
    slash-command packs, subagent definitions) that are malicious, tampered with, mis-pinned or loaded from a repository,
    plus the marketplaces that distribute them. Instruction content in a skill is both code and prompt.
  harness_surfaces:
  - SKILL.md and bundled scripts
  - plugin manifests and marketplaces (Claude Code plugins, VS Code/Open VSX extensions, ClawHub, omp extensions,
    dsh plugins)
  - plugin SHA/version pinning
  - install-time scripts and auto-update
  stride:
  - S
  - T
  - E
  mitre_atlas:
  - AML.T0010.005
  - AML.T0115.002
  - AML.T0011.001
  - AML.T0111
  owasp_llm_2025:
  - LLM03
  owasp_agentic:
  - ASI04
  owasp_mcp:
  - MCP04
  controls:
  - D06
  - D13
  - D14
  rules:
  - HG-INJ-001
  - HG-INJ-002
  incident_count: 6
  examples:
  - G7-I081
  - G1-I003
  - G6-088
  - G3-I005
  - G7-I080
  distinguishes: A skill is natural-language instruction executed by the agent with the user's tools, so malware
    needs no exploit and static scanners for code miss it; classic LLM apps have no equivalent end-user-installable
    instruction layer.
- id: T06
  name: Harness distribution and dependency supply chain
  definition: 'Compromise or integrity failure of the harness itself or of the packages around it: trojanised npm/PyPI
    releases, maintainer-account takeover, unauthorised publishes, curl-pipe-sh installers, unsigned auto-update,
    and accidental release of source or secrets in published artifacts. Worms that abuse the developer''s installed
    AI CLIs with auto-approve flags belong here.'
  harness_surfaces:
  - npm/PyPI/cargo packages and postinstall scripts
  - curl | sh installers
  - auto-update channel
  - release pipelines, signing and provenance
  - source maps and debug files in packages
  - ~/.claude.json, ~/.codex, ~/.gemini config files as harvest targets
  stride:
  - T
  - S
  - E
  mitre_atlas:
  - AML.T0010.001
  - AML.T0011.001
  - AML.T0010
  - AML.T0083
  owasp_llm_2025:
  - LLM03
  owasp_agentic:
  - ASI04
  owasp_mcp:
  - MCP04
