  incident_count: 2
  examples:
  - G3-I011
  - G3-I009
  distinguishes: Chat apps have per-user memory features too, but harness memory is plain files that are loaded
    into a context with shell access, shared across projects, and written by the same agent that reads untrusted
    repositories.
  mapping_notes: OWASP LLM04 (Data and Model Poisoning) is the closest LLM Top 10 2025 entry; it is framed around
    training data, so the mapping is partial.
- id: T11
  name: Sub-agent and cross-harness trust propagation
  definition: Permissions, environment variables, credentials and sandbox exemptions flow from a parent agent to
    sub-agents, delegated harnesses (one harness driving another) or background workers more broadly than the user
    intended, or a delegated agent defaults to an approve-everything configuration.
  harness_surfaces:
  - sub-agent / task tools and their tool allowlists
  - delegation to other CLIs (Hermes/dsh driving Claude Code or Codex)
  - heartbeat and scheduled runs
  - worktree isolation
  - tool relays between sandbox and host
  stride:
  - E
  - S
  mitre_atlas:
  - AML.T0118
  - AML.T0118.001
  - AML.T0053
  owasp_llm_2025:
  - LLM06
  owasp_agentic:
  - ASI03
