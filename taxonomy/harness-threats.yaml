- id: T15
  name: Telemetry, data residency, retention and audit gaps
  definition: 'Vendor-side handling of code, prompts and transcripts, and the visibility the customer gets: telemetry
    that continues despite opt-out, whole-workspace uploads, retention, training-use defaults, region, and missing
    or incomplete audit logs. Policy choices are recorded as such and not scored as vulnerabilities.'
  harness_surfaces:
  - telemetry and crash-reporting settings
  - cloud session upload / trajectory collection
  - retention and zero-data-retention options
  - training opt-out defaults
  - enterprise audit-log coverage
