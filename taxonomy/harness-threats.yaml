  - G3-I027
  - G1-I037
  distinguishes: Classic web and API authentication failures, but the service fronts a shell-capable agent so an
    unauthenticated request is remote code execution; local-first design makes browser-origin attacks (rebinding,
    CSWSH) the common path.
  mapping_notes: No OWASP LLM Top 10 2025 entry fits (classic OWASP API/Web risk); left empty rather than forced.
    Added in Phase 2. D16 is a proposed new dimension.
- id: T19
  name: Conventional software defects in agent runtimes and SDKs
  definition: 'Ordinary implementation bugs located in harness, SDK or tooling code that are not an agent-capability
    gate: unsafe deserialization of checkpoints or caches, SQL and argument injection, XSS in web UIs and registries,
    DoS and resource exhaustion, insecure temporary files, privilege escalation, terminal-emulator features. Included
    so that the share of non-agent-specific risk is measured honestly.'
  harness_surfaces:
  - checkpoint/state serialization (pickle, msgpack, JSON modes)
  - SQL-backed stores and filters
  - web UIs, session exports and registries
  - SDK helpers that build command lines
  - temp files and install paths
  - terminal escape-sequence handling
