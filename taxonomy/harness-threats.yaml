  - G1-I017
  - G5b-I17
  - G4-I034
  - INC-G5c-08
  distinguishes: The sandbox must contain code written by a model that an attacker can steer; escapes are therefore
    reachable remotely through content, unlike classic sandbox bugs that need hostile local code.
  mapping_notes: 'Added in Phase 2: these incidents were previously scattered across T03, T02 and T11.'
- id: T18
  name: Agent control-plane exposure and authorization
  definition: Local or networked services of the harness (HTTP/WebSocket servers, gateways, dashboards, pairing
    and scope systems, webhooks, IDE bridges) accept requests without authentication, origin or Host validation,
    or with mis-scoped authorization, so a web page, another local process or an internet scanner can drive the
    agent or read its state.
  harness_surfaces:
  - localhost HTTP/WebSocket servers (IDE extension bridges, web UIs, kanban/hub dashboards)
  - gateways bound to 0.0.0.0
  - DNS rebinding and cross-site WebSocket hijacking
  - device pairing and operator scopes
  - messaging webhooks
  - MCP servers exposed over HTTP without auth
  stride:
