# harnesswatch threat taxonomy (RQ1). Generated by the Phase 2 research lead; edit with care.
schema_version: 1
title: harnesswatch threat taxonomy for AI coding-agent harnesses (RQ1)
status: final for Phase 2; 2026-10-15
frameworks:
  mitre_atlas:
    url: https://github.com/mitre-atlas/atlas-data (dist/ATLAS-latest.yaml, format 6.0.0)
    site: https://atlas.mitre.org
    release: '2026.09'
    release_date: '2026-09-15'
    accessed: '2026-10-15'
    verification: Every technique id below was machine-checked to exist in ATLAS-latest.yaml and its name/description
      read; ids are techniques or sub-techniques of that release.
  owasp_llm_2025:
    url: https://genai.owasp.org/llm-top-10/
    version: OWASP Top 10 for LLM Applications 2025 (LLM01:2025..LLM10:2025)
    accessed: '2026-10-15'
    verification: List fetched from the primary page.
    caveat: A 2026 edition (v1.0, published 2026-08-03, https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/)
      exists and reportedly renumbers entries (e.g. Excessive Agency to LLM03, System Prompt Leakage replaced by
      Hidden Context Exposure). Its per-entry list could not be read from the primary source, so the crosswalk keeps
      the 2025 ids required by MISSION; remap when the 2026 text is read.
  owasp_agentic:
    url: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
